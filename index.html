<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Runner - Jump & Run</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0f0f23; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: monospace; overflow: hidden; }
#game-container { position: relative; }
canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; border: 2px solid #333; box-shadow: 0 0 30px rgba(100,100,255,0.15); }
#hud { position: absolute; top: 0; left: 0; right: 0; height: 40px; display: flex; align-items: center; padding: 0 12px; gap: 18px; font-size: 13px; color: #ccc; pointer-events: none; z-index: 2; background: linear-gradient(to bottom, rgba(15,15,35,0.85), transparent); }
.hud-item { display: flex; align-items: center; gap: 4px; }
.hud-item .icon { font-size: 15px; }
#xp-bar-bg { width: 120px; height: 8px; background: #222; border-radius: 4px; overflow: hidden; }
#xp-bar-fill { height: 100%; background: linear-gradient(90deg, #4eff4e, #00cc66); width: 0%; transition: width 0.3s; border-radius: 4px; }
#overlay { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; background: rgba(15,15,35,0.92); color: #eee; }
#overlay.hidden { display: none; }
#overlay h1 { font-size: 36px; margin-bottom: 8px; color: #6cf; text-shadow: 0 0 20px rgba(100,200,255,0.5); }
#overlay h2 { font-size: 20px; margin-bottom: 16px; color: #aaa; }
#overlay .subtitle { font-size: 13px; color: #888; margin-bottom: 20px; }
#overlay .stats { font-size: 13px; color: #aaa; margin: 8px 0; }
#overlay .btn { display: inline-block; margin: 6px; padding: 10px 28px; font-size: 15px; font-family: monospace; cursor: pointer; border: 2px solid #6cf; background: transparent; color: #6cf; border-radius: 6px; transition: all 0.2s; }
#overlay .btn:hover { background: #6cf; color: #0f0f23; }
#overlay .btn.disabled { opacity: 0.5; cursor: not-allowed; border-color: #666; color: #666; }
#overlay .btn.disabled:hover { background: transparent; color: #666; }
#overlay .skin-grid { display: flex; gap: 12px; margin: 12px 0; flex-wrap: wrap; justify-content: center; }
.skin-card { width: 64px; height: 80px; border: 2px solid #444; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; background: rgba(255,255,255,0.03); }
.skin-card:hover, .skin-card.selected { border-color: #6cf; background: rgba(100,200,255,0.08); }
.skin-card.locked { opacity: 0.35; cursor: not-allowed; }
.skin-card canvas { image-rendering: pixelated; }
.skin-card .name { font-size: 9px; color: #aaa; margin-top: 4px; }
.skin-card .req { font-size: 8px; color: #f84; }
#skill-display { display: flex; gap: 8px; margin: 10px 0; }
.skill-badge { padding: 4px 10px; font-size: 11px; border-radius: 4px; background: rgba(100,200,255,0.1); color: #6cf; border: 1px solid #6cf3; }
.skill-badge.locked { color: #555; border-color: #333; background: rgba(255,255,255,0.02); }
.skill-badge.active { color: #4f4; border-color: #4f4; background: rgba(0,255,100,0.1); }
.skill-grid { display: flex; gap: 12px; margin: 16px 0; flex-wrap: wrap; justify-content: center; }
.skill-card { width: 120px; height: 80px; border: 2px solid #444; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: all 0.2s; background: rgba(255,255,255,0.03); }
.skill-card.unlocked { border-color: #4f4; background: rgba(0,255,100,0.08); }
.skill-card.locked { opacity: 0.35; }
.skill-card .icon { font-size: 20px; margin-bottom: 4px; }
.skill-card .name { font-size: 10px; color: #aaa; margin-bottom: 2px; font-weight: bold; }

#hud-skills { display: flex; gap: 4px; }

.level-grid { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; justify-content: center; max-width: 600px; margin-left: auto; margin-right: auto; max-height: 400px; overflow-y: auto; }

<body>
<div id="game-container">
<canvas id="canvas" width="800" height="400"></canvas>
<div id="hud">
  <div class="hud-item"><span class="icon">⭐</span><span id="hud-score">0</span></div>
  <div class="hud-item"><span class="icon">🪙</span><span id="hud-coins">0</span></div>
  <div class="hud-item"><span class="icon">💎</span><span id="hud-gems">0</span></div>
  <div class="hud-item"><span class="icon">📊</span><span id="hud-level">Lv 1</span></div>
  <div class="hud-item" id="hud-shield" style="display:none"><span class="icon">🛡️</span></div>
  <div class="hud-item" id="hud-powerups"></div>
  <div class="hud-item" id="hud-skills"></div>
</div>
<div id="overlay">
  <h1>🎮 PIXEL RUNNER</h1>
  <h2>Jump & Run</h2>
  <div class="subtitle">Arrow Keys / WASD to move • Space to jump • Shift to dash</div>
  <div id="menu-content"></div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ═══════════════════════════════════════════════
// SUPABASE CONFIGURATION
// ═══════════════════════════════════════════════

const SUPABASE_URL = 'https://YOUR_PROJECT.supabase.co';
const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY';
const SUPABASE_CONFIGURED = !SUPABASE_URL.includes('YOUR_PROJECT');

// Initialize Supabase client
const supabaseClient = (window.supabase && SUPABASE_CONFIGURED) ?
  window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

let currentUser = null; // Supabase user object
let saveDebounceTimeout = null; // Prevent save spam

// ═══════════════════════════════════════════════
// ERROR TOAST SYSTEM
// ═══════════════════════════════════════════════

function showErrorToast(message) {
  const existingToast = document.querySelector('.error-toast');
  if (existingToast) {
    existingToast.remove();
  }

  const toast = document.createElement('div');
  toast.className = 'error-toast';
  toast.textContent = message;
  document.body.appendChild(toast);

  // Show toast
  setTimeout(() => toast.classList.add('show'), 100);

  // Auto-hide after 3 seconds
  setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

// ═══════════════════════════════════════════════
// SUPABASE SAVE/LOAD FUNCTIONS
// ═══════════════════════════════════════════════

async function saveProgress() {
  // Debounce saves to prevent rate limits
  if (saveDebounceTimeout) {
    clearTimeout(saveDebounceTimeout);
  }

  saveDebounceTimeout = setTimeout(async () => {
    try {
      if (!supabaseClient || !currentUser) {
        // Fallback to localStorage
        if (authState && authState.isLoggedIn && authState.email) {
          savePlayerProgress(authState.email);
        }
        return;
      }

      const data = {
        user_id: currentUser.id,
        player_level: gs.playerLevel,
        current_level: gs.currentLevel,
        total_score: gs.totalScore,
        coins: gs.coins,
        gems: gs.gems,
        owned_skins: gs.purchases.owned_skins || ['default'],
        owned_trails: gs.purchases.owned_trails || ['none'],
        active_skin: gs.purchases.active_skin || 'default',
        active_trail: gs.purchases.active_trail || 'none',
        active_boosters: gs.purchases.active_boosters || [],
        skills_unlocked: SKILLS.filter(s => s.unlocked).map(s => s.id),
        levels_completed: gs.levelsCompleted || []
      };

      const { error } = await supabaseClient
        .from('user_progress')
        .upsert(data, { onConflict: 'user_id' });

      if (error) {
        console.error('Supabase save error:', error);
        showErrorToast('Failed to save progress to cloud');
        // Fallback to localStorage
        if (authState && authState.isLoggedIn && authState.email) {
          savePlayerProgress(authState.email);
        }
      }
    } catch (error) {
      console.error('Save progress error:', error);
      showErrorToast('Failed to save progress');
      // Fallback to localStorage
      if (authState && authState.isLoggedIn && authState.email) {
        savePlayerProgress(authState.email);
      }
    }
  }, 5000); // Debounce for 5 seconds
}

async function loadProgress() {
  try {
    if (!supabaseClient || !currentUser) {
      // Fallback to localStorage
      if (authState && authState.isLoggedIn && authState.email) {
        loadPlayerProgress(authState.email);
      }
      return;
    }

    const { data, error } = await supabaseClient
      .from('user_progress')
      .select('*')
      .eq('user_id', currentUser.id)
      .single();

    if (error && error.code !== 'PGRST116') { // PGRST116 = no rows returned
      console.error('Supabase load error:', error);
      showErrorToast('Failed to load progress from cloud');
      // Fallback to localStorage
      if (authState && authState.isLoggedIn && authState.email) {
        loadPlayerProgress(authState.email);
      }
      return;
    }

    if (data) {
      // Merge cloud data into game state
      gs.playerLevel = data.player_level || 1;
      gs.currentLevel = data.current_level || 1;
      gs.totalScore = data.total_score || 0;
      gs.coins = data.coins || 0;
      gs.gems = data.gems || 0;
      gs.purchases.owned_skins = data.owned_skins || ['default'];
      gs.purchases.owned_trails = data.owned_trails || ['none'];
      gs.purchases.active_skin = data.active_skin || 'default';
      gs.purchases.active_trail = data.active_trail || 'none';
      gs.purchases.active_boosters = data.active_boosters || [];
      gs.levelsCompleted = data.levels_completed || [];

      // Update skills based on unlocked list
      const unlockedSkillIds = data.skills_unlocked || [];
      SKILLS.forEach(skill => {
        skill.unlocked = unlockedSkillIds.includes(skill.id);
      });

      // Update UI
      syncScoreDisplay();
      checkSkillUnlocks();
    } else {
      // No cloud data, use defaults or localStorage fallback
      if (authState && authState.isLoggedIn && authState.email) {
        loadPlayerProgress(authState.email);
      }
    }
  } catch (error) {
    console.error('Load progress error:', error);
    showErrorToast('Failed to load progress');
    // Fallback to localStorage
    if (authState && authState.isLoggedIn && authState.email) {
      loadPlayerProgress(authState.email);
    }
  }
}

// ═══════════════════════════════════════════════
// INLINED ScoreTracker (from score-tracker.js)
// ═══════════════════════════════════════════════
class ScoreTracker {
  constructor(unitSize = 8) {
    const normalized = Math.floor(unitSize);
    this.unitSize = normalized > 0 ? normalized : 1;
    this.highWater = 0;
  }
  reset(initialPosition = 0) {
    this.highWater = Math.max(0, Number.isFinite(initialPosition) ? initialPosition : 0);
  }
  award(currentPosition) {
    const position = Math.max(0, Number.isFinite(currentPosition) ? currentPosition : 0);
    if (position <= this.highWater) return 0;
    const previousUnits = Math.floor(this.highWater / this.unitSize);
    const nextUnits = Math.floor(position / this.unitSize);
    this.highWater = position;
    const delta = nextUnits - previousUnits;
    return delta > 0 ? delta : 0;
  }
  getHighWater() { return this.highWater; }
}

function syncScoreDisplay(element, score) {
  if (!element) return;
  element.textContent = String(score);
}

// ═══════════════════════════════════════════════
// CONFIG & CONSTANTS
// ═══════════════════════════════════════════════
const CONFIG = {
  CANVAS_WIDTH: 800, CANVAS_HEIGHT: 400, TILE_SIZE: 16,
  GRAVITY: 0.6, MAX_FALL_SPEED: 12, FPS: 60,
  PLAYER_SPEED: 3.2, JUMP_VELOCITY: -10.5, DASH_SPEED: 12, DASH_FRAMES: 8,
  COYOTE_FRAMES: 5, JUMP_BUFFER_FRAMES: 4,
  LEVEL_WIDTH_TILES: 200, LEVEL_HEIGHT_TILES: 25,
  CAMERA_LERP: 0.08,
  DEBUG_HUD: false // Toggle to true to render on-canvas HUD fallback
};

const PLAYER_START_X = 80;
const PLAYER_START_Y = (CONFIG.LEVEL_HEIGHT_TILES - 4) * CONFIG.TILE_SIZE;
const PROGRESS_UNIT = CONFIG.TILE_SIZE / 2;

// ═══════════════════════════════════════════════
// SKINS
// ═══════════════════════════════════════════════
const SKINS = [
  { id: 'default', name: 'Runner', color: '#4CAF50', unlockType: 'free', cost: 0, levelReq: 0 },
  { id: 'blue', name: 'Ocean', color: '#2196F3', unlockType: 'level', cost: 0, levelReq: 3 },
  { id: 'red', name: 'Blaze', color: '#f44336', unlockType: 'level', cost: 0, levelReq: 5 },
  { id: 'purple', name: 'Mystic', color: '#9C27B0', unlockType: 'coins', cost: 300, levelReq: 0 },
  { id: 'orange', name: 'Sunset', color: '#FF9800', unlockType: 'coins', cost: 500, levelReq: 10 },
  { id: 'cyan', name: 'Frost', color: '#00BCD4', unlockType: 'coins', cost: 800, levelReq: 15 },
  { id: 'gold', name: 'Champion', color: '#FFD700', unlockType: 'coins', cost: 1500, levelReq: 25 },
  { id: 'pink', name: 'Bubblegum', color: '#E91E63', unlockType: 'coins', cost: 1000, levelReq: 20 },
  { id: 'dark', name: 'Shadow', color: '#212121', unlockType: 'coins', cost: 2000, levelReq: 30 },
  { id: 'rainbow', name: 'Prismatic', color: 'rainbow', unlockType: 'gems', cost: 50, levelReq: 40 },
  { id: 'diamond', name: 'Diamond', color: '#B9F2FF', unlockType: 'gems', cost: 100, levelReq: 50 },
  { id: 'neon', name: 'Neon', color: '#39FF14', unlockType: 'coins', cost: 3000, levelReq: 60 }
];

// ═══════════════════════════════════════════════
// SHOP ITEMS
// ═══════════════════════════════════════════════
const BOOSTERS = [

    theme: biome.theme,
    name: `${biome.theme} ${levelInBiome}`,
    icon: biome.icon,
    baseScore: 1500 + i * 100,
    difficulty: Math.floor(i / 10) + 1
  });
}

function xpForLevel(lvl) { return lvl * 100; }

function checkLevelUp() {
  let leveled = false;
  while (gs.xp >= xpForLevel(gs.playerLevel)) {
    gs.xp -= xpForLevel(gs.playerLevel);
    gs.playerLevel++;
    leveled = true;
    // Unlock skills for new level
    SKILLS.forEach(skill => {
      if (!gs.unlockedSkills.includes(skill.id) && gs.playerLevel >= skill.levelReq) {
        gs.unlockedSkills.push(skill.id);
      }
    });
  }
  if (leveled) saveGameState();
  return leveled;
}

// ═══════════════════════════════════════════════
// LEVEL PROGRESS SYSTEM
// ═══════════════════════════════════════════════
function initializeLevelProgress() {
  // Create default progress state for all levels
  const defaultProgress = {};
  for (const level of LEVELS) {
    defaultProgress[level.id] = {
      unlocked: level.id === 1, // Only level 1 starts unlocked
      completed: false,
      bestScore: 0,
      stars: 0
    };
  }
  return defaultProgress;
}

function saveLevelProgress() {
  try {
    localStorage.setItem('pixelRunner_levelProgress', JSON.stringify(gs.levelProgress));
  } catch (e) {
    console.warn('Could not save level progress:', e);
  }
}

function loadLevelProgress() {
  try {
    const saved = localStorage.getItem('pixelRunner_levelProgress');
    if (saved) {
      const progress = JSON.parse(saved);
      // Merge with defaults to ensure all levels are present
      const defaults = initializeLevelProgress();
      gs.levelProgress = { ...defaults, ...progress };
    } else {
      gs.levelProgress = initializeLevelProgress();
    }
  } catch (e) {
    console.warn('Could not load level progress, using defaults:', e);
    gs.levelProgress = initializeLevelProgress();
  }
}

function calculateStarRating(score, baseScore) {
  if (score >= baseScore) return 3;
  if (score >= baseScore * 0.75) return 2;
  if (score >= baseScore * 0.5) return 1;
  return 0;
}

function completeLevel(levelId, score) {
  const progress = gs.levelProgress[levelId];
  if (!progress) return;

  const level = LEVELS.find(l => l.id === levelId);
  if (!level) return;

  progress.completed = true;
  progress.bestScore = Math.max(progress.bestScore, score);
  progress.stars = Math.max(progress.stars, calculateStarRating(score, level.baseScore));

  // Unlock next level if exists
  const nextLevel = LEVELS.find(l => l.id === levelId + 1);
  if (nextLevel && gs.levelProgress[nextLevel.id]) {
    gs.levelProgress[nextLevel.id].unlocked = true;
  }

  saveLevelProgress();
}

function isLevelUnlocked(levelId) {
  return gs.levelProgress[levelId]?.unlocked || false;
}

function getLevelStars(levelId) {
  return gs.levelProgress[levelId]?.stars || 0;
}

function getLevelBestScore(levelId) {
  return gs.levelProgress[levelId]?.bestScore || 0;
}

function initializeBattlePass() {
  const tiers = [];
  for (let i = 1; i <= 20; i++) {
    const xpThreshold = i * 500;
    tiers.push({
      tier: i,
      xpThreshold: xpThreshold,
      freeReward: {
        type: i % 5 === 0 ? "gems" : "coins",
        amount: i % 5 === 0 ? (i === 20 ? 500 : i * 10) : (i === 20 ? 5000 : i * 50)
      },
      premiumReward: {
        type: i % 3 === 0 ? "skin" : "cosmetic",
        id: i % 3 === 0 ? `bp_skin_${i}` : `bp_trail_${i}`,
        name: i % 3 === 0 ? `Battle Skin ${i}` : `Battle Trail ${i}`
      },
      claimed: false,
      premiumClaimed: false
    });
  }

  return {
    season: 1,
    seasonStartDate: "2026-04-01",
    totalXP: 0,
    lastDailyReset: Date.now(),
    premiumUnlocked: true, // Mock as purchased for now
    tiers: tiers,
    dailyChallenges: generateDailyChallenges()
  };
}

function generateDailyChallenges() {
  const challenges = [
    {id: "score_challenge", text: "Score 5000 pts", target: 5000, progress: 0, reward: 200, claimed: false, type: "score"},
    {id: "level_challenge", text: "Complete 2 levels", target: 2, progress: 0, reward: 150, claimed: false, type: "levels"},
    {id: "coin_challenge", text: "Collect 50 coins", target: 50, progress: 0, reward: 100, claimed: false, type: "coins"}
  ];
  return challenges;
}

function earnBattlePassXP(amount, source = "gameplay") {
  const oldXP = gs.battlePass.totalXP;
  gs.battlePass.totalXP += amount;

  // Check for tier progression
  const oldTier = getCurrentBattlePassTier();
  checkBattlePassTierUnlock();
  const newTier = getCurrentBattlePassTier();

  // Show floating text
  addFloatingText(`+${amount} Season XP`, gs.player.x, gs.player.y - 20, '#4ef', 1.5);

  if (newTier > oldTier) {
    addFloatingText(`TIER ${newTier} UNLOCKED!`, gs.player.x, gs.player.y - 40, '#fc4', 2);
  }

  return amount;
}

function getCurrentBattlePassTier() {
  let tier = 0;
  for (const tierData of gs.battlePass.tiers) {
    if (gs.battlePass.totalXP >= tierData.xpThreshold) {
      tier = tierData.tier;
    } else {
      break;
    }
  }
  return tier;
}

function checkBattlePassTierUnlock() {
  // Just ensure tiers are properly unlocked based on XP
  const currentTier = getCurrentBattlePassTier();
  // Auto-claim free rewards for unlocked tiers
  for (let i = 0; i < currentTier; i++) {
    const tierData = gs.battlePass.tiers[i];
    if (!tierData.claimed) {
      claimBattlePassReward(tierData.tier, false);
    }
  }
}

function claimBattlePassReward(tier, isPremium = false) {
  const tierData = gs.battlePass.tiers[tier - 1];
  if (!tierData) return false;

  if (isPremium && !gs.battlePass.premiumUnlocked) return false;
  if (isPremium && tierData.premiumClaimed) return false;
  if (!isPremium && tierData.claimed) return false;
  if (gs.battlePass.totalXP < tierData.xpThreshold) return false;

  const reward = isPremium ? tierData.premiumReward : tierData.freeReward;

  // Apply reward
  if (reward.type === "coins") {
    gs.totalCoins += reward.amount;
    gs.coins += reward.amount;
  } else if (reward.type === "gems") {
    gs.totalGems += reward.amount;
    gs.gems += reward.amount;
  } else if (reward.type === "skin") {
    // Add skin to unlocked list
    if (!gs.ownedSkins.includes(reward.id)) {
      gs.ownedSkins.push(reward.id);
    }
  } else if (reward.type === "cosmetic") {
    // Add cosmetic to inventory
    const existing = gs.inventory.cosmetics.find(c => c.id === reward.id);
    if (!existing) {
      gs.inventory.cosmetics.push({id: reward.id, quantity: 1, active: false});
    }
  }

  // Mark as claimed
  if (isPremium) {
    tierData.premiumClaimed = true;
  } else {
    tierData.claimed = true;
  }

  return true;
}

function updateDailyChallenges() {
  const now = Date.now();
  const lastReset = gs.battlePass.lastDailyReset;
  const oneDayMs = 24 * 60 * 60 * 1000;

  if (now - lastReset > oneDayMs) {
    // Reset daily challenges
    gs.battlePass.dailyChallenges = generateDailyChallenges();
    gs.battlePass.lastDailyReset = now;
  }
}

function updateChallengeProgress(type, amount) {
  for (const challenge of gs.battlePass.dailyChallenges) {
    if (challenge.type === type && !challenge.claimed) {
      challenge.progress = Math.min(challenge.progress + amount, challenge.target);
      if (challenge.progress >= challenge.target && !challenge.claimed) {
        // Auto-claim challenge
        challenge.claimed = true;
        earnBattlePassXP(challenge.reward, "challenge");
        addFloatingText(`CHALLENGE COMPLETE! +${challenge.reward} XP`, gs.player?.x || 400, gs.player?.y || 200, '#fc4', 2);
      }
    }
  }
}

function handleLogin() {
  const auth = getAuthFunctions();
  if (!auth) return;

  const emailInput = document.getElementById('login-email');
  const passwordInput = document.getElementById('login-password');
  const emailError = document.getElementById('email-error');
  const passwordError = document.getElementById('password-error');
  const authMessage = document.getElementById('auth-message');

  // Clear previous errors
  emailError.textContent = '';
  passwordError.textContent = '';
  authMessage.textContent = '';

  const email = emailInput.value;
  const password = passwordInput.value;

  const validation = auth.validateLoginInput(email, password);

  // Display field-specific errors
  if (validation.errors.email) {
    emailError.textContent = validation.errors.email;
  }
  if (validation.errors.password) {
    passwordError.textContent = validation.errors.password;
  }

  // If there are validation errors, stop here
  if (Object.keys(validation.errors).length > 0) {
    return;
  }

  // Mock authentication: any valid email + non-empty password succeeds
  authState.email = validation.normalizedEmail;
  auth.applyLoginSuccess(authState);

  // Load saved progress
  loadPlayerProgress(authState.email);

  // Update logged-in indicator
  updateLoggedInIndicator();

  // Transition to main menu
  showMainMenu();
}

async function handleSupabaseLogin(isSignup = false) {
  if (!supabaseClient) {
    showErrorToast('Supabase not available');
    return;
  }

  const emailInput = document.getElementById('login-email');
  const passwordInput = document.getElementById('login-password');
  const emailError = document.getElementById('email-error');
  const passwordError = document.getElementById('password-error');
  const authMessage = document.getElementById('auth-message');

  // Clear previous errors
  emailError.textContent = '';
  passwordError.textContent = '';
  authMessage.textContent = '';

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  // Basic validation
  if (!email) {
    emailError.textContent = 'Email is required';
    return;
  }
  if (!password) {
    passwordError.textContent = 'Password is required';
    return;
  }
  if (password.length < 6) {
    passwordError.textContent = 'Password must be at least 6 characters';
    return;
  }

  try {
    authMessage.textContent = isSignup ? 'Creating account...' : 'Signing in...';
    authMessage.style.color = '#6cf';

    let result;
    if (isSignup) {
      result = await supabaseClient.auth.signUp({
        email: email,
        password: password
      });
    } else {
      result = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });
    }

    if (result.error) {
      authMessage.textContent = result.error.message;
      authMessage.style.color = '#f44';
      return;
    }

    if (isSignup && !result.data.user.email_confirmed_at) {
      authMessage.textContent = 'Please check your email to confirm your account';
      authMessage.style.color = '#fc4';
      return;
    }

    // Success!
    currentUser = result.data.user;
    authState = authState || {};
    authState.isLoggedIn = true;
    authState.email = email;

    // Load progress from Supabase
    await loadProgress();

    // Update UI
    updateLoggedInIndicator();

    // Transition to main menu
    showMainMenu();

  } catch (error) {
    console.error('Supabase auth error:', error);
    authMessage.textContent = 'Authentication failed. Please try again.';
    authMessage.style.color = '#f44';
  }
}

function playAsGuest() {
  // Reset to default values for guest mode
  resetGameStateToDefaults();
  showMainMenu();
}

async function handleLogout() {
  const auth = getAuthFunctions();
  if (!auth || !authState) return;

  try {
    // Save current progress before logout
    if (authState.isLoggedIn) {
      if (supabaseClient && currentUser) {
        await saveProgress(); // Use Supabase save
      } else {
        savePlayerProgress(authState.email); // Fallback to localStorage
      }
    }

    // Logout from Supabase if available
    if (supabaseClient && currentUser) {
      await supabaseClient.auth.signOut();
      currentUser = null;
    }

    // Reset auth state
    auth.applyLogout(authState);
    authState.email = '';

    // Hide logged-in indicator
    updateLoggedInIndicator();

    // Show login screen
    showLoginScreen();

  } catch (error) {
    console.error('Logout error:', error);
    // Still proceed with logout even if there's an error
    if (authState) {
      const auth = getAuthFunctions();
      auth.applyLogout(authState);
      authState.email = '';
    }
    currentUser = null;
    updateLoggedInIndicator();
    showLoginScreen();
  }
}

async function loadLeaderboardData() {
  const contentDiv = document.getElementById('leaderboard-content');

  if (!supabaseClient || !SUPABASE_CONFIGURED) {
    contentDiv.innerHTML = `
      <div class="leaderboard-empty">
        <p>🌐 Leaderboard unavailable</p>
        <p>Supabase not configured</p>
      </div>
    `;
    return;
  }

  const leaderboardData = await fetchLeaderboard();

  if (!leaderboardData) {
    contentDiv.innerHTML = `
      <div class="leaderboard-empty">
        <p>❌ Failed to load leaderboard</p>
        <p>Try again later</p>
      </div>
    `;
    return;
  }

  if (leaderboardData.length === 0) {
    contentDiv.innerHTML = `
      <div class="leaderboard-empty">
        <p>🎮 No scores yet!</p>
        <p>Be the first to set a score</p>
      </div>
    `;
    return;
  }

  let currentUserRank = -1;
  if (currentUser) {
    // Find current user's rank
    for (let i = 0; i < leaderboardData.length; i++) {
      if (leaderboardData[i].user_id === currentUser.id) {
        currentUserRank = i + 1;
        break;
      }
    }
  }

  const entriesHtml = leaderboardData.map((entry, index) => {
    const rank = index + 1;
    const isCurrentUser = currentUser && entry.user_id === currentUser.id;
    const playerName = isCurrentUser ? 'You' : `Player #${rank}`;

    return `
      <div class="leaderboard-entry ${isCurrentUser ? 'current-user' : ''}">
        <div class="leaderboard-rank">#${rank}</div>
        <div class="leaderboard-player">${playerName}</div>
        <div class="leaderboard-level">Lv ${entry.player_level || 1}</div>
        <div class="leaderboard-score">${(entry.total_score || 0).toLocaleString()}</div>
      </div>
    `;
  }).join('');

  contentDiv.innerHTML = entriesHtml;
}

async function refreshLeaderboard() {
  const refreshBtn = document.querySelector('.leaderboard-refresh');
  if (refreshBtn) {
    refreshBtn.textContent = 'Loading...';
  }

  await loadLeaderboardData();

  if (refreshBtn) {
    refreshBtn.textContent = 'Refresh ↻';
  }
}

function getSaveKey(email) {
  try {
    return `pixelrunner_save_${btoa(email.toLowerCase().trim())}`;
  } catch (e) {
    console.warn('Error creating save key:', e);
    return null;
  }
}

function createDefaultSaveData() {
  return {
    saveVersion: 1,
    playerLevel: 1,
    xp: 0,
    totalCoins: 0,
    totalGems: 0,
    totalScore: 0,
    bestScore: 0,
    selectedSkin: 0,
    unlockedSkills: [],
    completedLevels: [],
    battlePassTier: 0
  };
}

function saveGameState() {
  // Save current game state to localStorage
  try {
    const email = (typeof authState !== 'undefined' && authState && authState.email) ? authState.email : 'guest';
    savePlayerProgress(email);
    saveLevelProgress();
    saveShopData();
  } catch (e) {
    console.warn('Could not save game state:', e);
  }
}

function savePlayerProgress(email) {
  if (!email) return;

  const saveKey = getSaveKey(email);
  if (!saveKey) return;

  const saveData = {
    saveVersion: 1,
    playerLevel: gs.playerLevel,
    xp: gs.xp,
    totalCoins: gs.totalCoins,
    totalGems: gs.totalGems,
    totalScore: gs.totalScore,
    bestScore: gs.bestScore,
    selectedSkin: gs.selectedSkin,
    unlockedSkills: [...gs.unlockedSkills],
    completedLevels: [],  // Will be used in future tasks
    battlePass: gs.battlePass
  };

  try {
    localStorage.setItem(saveKey, JSON.stringify(saveData));
    saveBattlePassData(); // Also save separately for persistence
  } catch (e) {
    console.warn('Could not save player progress:', e);
    // Continue playing as guest mode silently
  }
}

function loadPlayerProgress(email) {
  if (!email) return;

  const saveKey = getSaveKey(email);
  if (!saveKey) return;

  try {
    const savedData = localStorage.getItem(saveKey);
    if (!savedData) {
      // New player - use defaults
      const defaults = createDefaultSaveData();
      applyLoadedData(defaults);
      return;
    }

    let saveData;
    try {
      saveData = JSON.parse(savedData);
    } catch (e) {
      console.warn('Corrupted save data, using defaults:', e);
      const defaults = createDefaultSaveData();
      applyLoadedData(defaults);
      return;
    }

    // Apply save data with fallbacks for missing fields
    const defaults = createDefaultSaveData();
    const merged = Object.assign(defaults, saveData);
    applyLoadedData(merged);

  } catch (e) {
    console.warn('Could not load player progress:', e);
    // Use defaults if localStorage unavailable
    const defaults = createDefaultSaveData();
    applyLoadedData(defaults);
  }
}

function applyLoadedData(saveData) {
  gs.playerLevel = saveData.playerLevel || 1;
  gs.xp = saveData.xp || 0;
  gs.totalCoins = saveData.totalCoins || 0;
  gs.totalGems = saveData.totalGems || 0;
  gs.totalScore = saveData.totalScore || 0;
  gs.bestScore = saveData.bestScore || 0;
  gs.selectedSkin = validateSkinIndex(saveData.selectedSkin) ? saveData.selectedSkin : 0;
  gs.unlockedSkills = Array.isArray(saveData.unlockedSkills) ? saveData.unlockedSkills : [];

  // Load battle pass data
  if (saveData.battlePass) {
    gs.battlePass = { ...initializeBattlePass(), ...saveData.battlePass };
  } else {
    loadBattlePassData();
  }

  // Check skill unlocks based on loaded player level
  checkSkillUnlocks();
}

function resetGameStateToDefaults() {
  const defaults = createDefaultSaveData();
  applyLoadedData(defaults);
  gs.battlePass = initializeBattlePass(); // Reset battle pass to defaults
}

function updateHUD() {
  if (!gs.player) return;

  if (hudEls.score) {
    const nextScore = Math.floor(gs.score);
    if (nextScore !== hudPrev.score) {
      hudEls.score.textContent = nextScore;
      hudPrev.score = nextScore;
    }
  }

  if (hudEls.coins && gs.coins !== hudPrev.coins) {
    hudEls.coins.textContent = gs.coins;
    hudPrev.coins = gs.coins;
  }

  if (hudEls.gems && gs.gems !== hudPrev.gems) {
    hudEls.gems.textContent = gs.gems;
    hudPrev.gems = gs.gems;
  }

  if (hudEls.level && gs.levelNum !== hudPrev.level) {
    hudEls.level.textContent = 'Lv ' + gs.levelNum;
    hudPrev.level = gs.levelNum;
  }

  if (hudEls.shield) {
    const shieldActive = gs.player && gs.player.shieldHP > 0 ? 1 : 0;
    if (shieldActive !== hudPrev.shield) {
      hudEls.shield.style.display = shieldActive ? 'flex' : 'none';
      hudPrev.shield = shieldActive;
    }
  }

  updatePowerupIndicators();
  updateSkillIndicators();
}

function updatePowerupIndicators() {
  if (!hudEls.powerups || !gs.powerUps) return;
  const speedSec = gs.powerUps.speed > 0 ? Math.ceil(gs.powerUps.speed / 60) : 0;
  const magnetSec = gs.powerUps.magnet > 0 ? Math.ceil(gs.powerUps.magnet / 60) : 0;

  if (speedSec === hudPrev.speedPU && magnetSec === hudPrev.magnetPU) return;

  hudPrev.speedPU = speedSec;
  hudPrev.magnetPU = magnetSec;

  let html = '';
  if (speedSec > 0) html += '<span style="color:#ff0;font-size:10px">⚡' + speedSec + 's</span> ';
  if (magnetSec > 0) html += '<span style="color:#f0f;font-size:10px">🧲' + magnetSec + 's</span> ';
  hudEls.powerups.innerHTML = html.trim();
}

function updateSkillIndicators() {
  if (!hudEls.skills) return;
  
  let html = '';
  const hasDash = gs.unlockedSkills.includes('dash');
  
  if (hasDash && gs.player) {
    const canDash = gs.player.canDash;
    const isInDash = gs.player.dashTimer > 0;
    
    if (isInDash) {
      html += '<span class="hud-skill">💨</span>';
    } else if (canDash) {
      html += '<span class="hud-skill">💨</span>';
    } else {
      html += '<span class="hud-skill cooldown">💨</span>';
    }
  }

  if (html !== hudPrev.skillsDisplay) {
    hudEls.skills.innerHTML = html;
    hudPrev.skillsDisplay = html;
  }
}

// PIXEL SPRITE RENDERER
// ═══════════════════════════════════════════════
function drawSprite(spriteData, x, y, scale = 1, flipX = false) {
  const s = scale;
  for (let row = 0; row < spriteData.length; row++) {
    for (let col = 0; col < spriteData[row].length; col++) {
      const c = spriteData[row][col];
      if (!c) continue;
      ctx.fillStyle = c;
      const px = flipX ? x + (spriteData[row].length - 1 - col) * s : x + col * s;
      ctx.fillRect(Math.floor(px), Math.floor(y + row * s), s, s);
    }
  }
}

function makePlayerSprite(colors, frame = 0) {
  const [body, dark, highlight, belt, outline] = colors;
  const base = [
    [0,0,0,0,outline,outline,outline,outline,0,0,0,0],
    [0,0,0,outline,highlight,highlight,highlight,highlight,outline,0,0,0],
    [0,0,outline,highlight,'#fff','#000',highlight,'#000','#fff',outline,0,0],
    [0,0,outline,highlight,highlight,highlight,highlight,highlight,highlight,outline,0,0],
    [0,0,0,outline,outline,body,body,outline,outline,0,0,0],
    [0,0,outline,body,body,body,body,body,body,outline,0,0],
    [0,outline,body,body,body,belt,belt,body,body,body,outline,0],
    [0,outline,body,body,body,belt,belt,body,body,body,outline,0],
    [0,outline,dark,body,body,body,body,body,body,dark,outline,0],
    [0,0,outline,dark,body,body,body,body,dark,outline,0,0],
    [0,0,outline,dark,dark,dark,dark,dark,dark,outline,0,0],
    [0,0,outline,dark,dark,0,0,dark,dark,outline,0,0],
    [0,0,outline,dark,dark,0,0,dark,dark,outline,0,0],
    [0,outline,outline,dark,dark,0,0,dark,dark,outline,outline,0],
    [0,outline,body,outline,0,0,0,0,outline,body,outline,0],
    [outline,body,body,outline,0,0,0,0,outline,body,body,outline],
  ];
  if (frame % 2 === 1 && frame > 0) {
    base[14] = [0,0,outline,body,outline,0,0,outline,body,outline,0,0];
    base[15] = [0,outline,body,body,outline,0,0,outline,body,body,outline,0];
  }
  return base;
}

// SKIN SELECTION UI
// ═══════════════════════════════════════════════
function getSkinColors(skin) {
  // Generate a 5-color palette [body, dark, highlight, belt, outline] from a single color
  if (skin.colors) return skin.colors; // If already defined as array
  const c = skin.color || '#888';
  if (c === 'rainbow') return ['#ff4444', '#cc2222', '#ff8888', '#ffcc00', '#880000'];
  // Derive darker/lighter variants from base color
  return [c, '#222', '#fff', '#444', '#111'];
}

function createSkinPreview(skin, size = 32) {
  const previewCanvas = document.createElement('canvas');
  previewCanvas.width = size;
  previewCanvas.height = size;
  const previewCtx = previewCanvas.getContext('2d');

  // Create a small player sprite using the skin colors
  const sprite = makePlayerSprite(getSkinColors(skin), 0);
  const spriteScale = Math.floor(size / 16); // Scale to fit canvas
  
  // Center the sprite
  const offsetX = Math.floor((size - sprite[0].length * spriteScale) / 2);
  const offsetY = Math.floor((size - sprite.length * spriteScale) / 2);
  
  for (let row = 0; row < sprite.length; row++) {
    for (let col = 0; col < sprite[row].length; col++) {
      const color = sprite[row][col];
      if (color && color !== 0) {
        previewCtx.fillStyle = color;
        previewCtx.fillRect(
          offsetX + col * spriteScale, 
          offsetY + row * spriteScale, 
          spriteScale, 
          spriteScale
        );
      }
    }
  }
  
  return previewCanvas;
}

    // Shop content based on active tab
    html += '<div id="shop-content">';
    html += getShopTabContent(gs.shopTab);
    html += '</div>';

    html += '<div class="btn" onclick="returnToMenu()">Back to Menu</div>';
    html += '<div style="margin-top: 8px; font-size: 10px; color: #666;">Press ESC to return</div>';

    menuContent.innerHTML = html;
  });
}

function switchShopTab(tab) {
  gs.shopTab = tab;
  const shopContent = document.getElementById('shop-content');
  if (shopContent) {
    shopContent.innerHTML = getShopTabContent(tab);
  }

  // Update tab button styles
  document.querySelectorAll('#overlay .btn').forEach(btn => {
    if (btn.onclick && btn.onclick.toString().includes('switchShopTab')) {
      if (btn.onclick.toString().includes(`'${tab}'`)) {
        btn.style.background = '#6cf';
        btn.style.color = '#0f0f23';
      } else {
        btn.style.background = 'transparent';
        btn.style.color = '#6cf';
      }
    }
  });
}

function getShopTabContent(tab) {
  switch (tab) {
    case 'skins':
      return generateSkinShopContent();
    case 'boosters':
      return generateBoosterShopContent();
    case 'trails':
      return generateCosmeticShopContent();
    default:
      return '<div>Invalid tab</div>';
  }
}

function generateSkinShopContent() {
  let html = '<div style="margin-bottom: 12px; font-size: 14px; color: #fc4;">Character Skins</div>';
  html += '<div class="skin-grid" style="max-width: 600px; margin: 0 auto;">';

  SKINS.forEach((skin, index) => {
    const isSelected = index === gs.selectedSkin;
    const isOwned = gs.ownedSkins.includes(skin.id);
    const skinCurrency = skin.unlockType || 'free'; // 'free', 'level', 'coins', 'gems'
    const skinCost = skin.cost || 0;
    const skinLevelReq = skin.levelReq || 0;
    const canAfford = (skinCurrency === 'gems') ? gs.totalGems >= skinCost : gs.totalCoins >= skinCost;
    const meetsLevel = gs.playerLevel >= skinLevelReq;
    const isLevelLocked = !meetsLevel && !canAfford;

    let cardClass = 'skin-card';
    if (isSelected) cardClass += ' selected';
    if (isLevelLocked && !isOwned) cardClass += ' locked';

    html += `<div class="${cardClass}" style="width: 80px; height: 100px;">`;

    // Skin preview (simplified colored rectangle for now)
    const skinColor = skin.color || '#888';
    const borderColor = skin.color === 'rainbow' ? '#fff' : skinColor;
    const bgColor = skin.color === 'rainbow' ? 'linear-gradient(45deg, red, orange, yellow, green, blue, violet)' : skinColor;
    html += `<div style="width: 32px; height: 32px; background: ${bgColor}; border: 2px solid ${borderColor}; border-radius: 4px; margin-bottom: 4px;"></div>`;

    html += `<div class="name">${skin.name}</div>`;

    if (isSelected) {
      html += '<div style="color: #4f4; font-size: 8px;">✓ Equipped</div>';
    } else if (isOwned) {
      html += `<div class="btn" onclick="equipSkin(${index})" style="padding: 2px 8px; font-size: 10px; margin-top: 4px;">Equip</div>`;
    } else if (skinCurrency === 'free' || skinCurrency === 'level') {
      if (meetsLevel) {
        html += `<div class="btn" onclick="purchaseItem('skin', '${skin.id}', 0, ${index})" style="padding: 2px 8px; font-size: 10px; margin-top: 4px;">Unlock</div>`;
      } else {
        html += `<div class="req">Lv ${skinLevelReq}</div>`;
      }
    } else if (!isOwned && (canAfford || meetsLevel)) {
      const currencyIcon = skinCurrency === 'gems' ? '💎' : '⭐';
      html += `<div class="btn ${!canAfford ? 'disabled' : ''}" onclick="${canAfford ? `purchaseItem('skin', '${skin.id}', ${skinCost}, ${index})` : 'void(0)'}" style="padding: 2px 8px; font-size: 10px; margin-top: 4px; ${!canAfford ? 'opacity: 0.5; cursor: not-allowed;' : ''}">${currencyIcon}${skinCost}</div>`;
    } else {
      html += `<div class="req">Lv ${skinLevelReq}</div>`;
    }

    if (skin.bonusDesc) {
      html += `<div style="color: #fc4; font-size: 7px; margin-top: 2px;">${skin.bonusDesc}</div>`;
    }

    html += '</div>';
  });

  html += '</div>';
  return html;
}

function generateBoosterShopContent() {
  let html = '<div style="margin-bottom: 12px; font-size: 14px; color: #fc4;">Power-up Boosters</div>';
  html += '<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; max-width: 600px; margin: 0 auto;">';

  BOOSTERS.forEach(booster => {
    const owned = gs.inventory.boosters.find(b => b.id === booster.id);
    const quantity = owned ? owned.quantity : 0;
    const canAfford = booster.currency === 'coins' ? gs.totalCoins >= booster.cost : gs.totalGems >= booster.cost;
    const currencyIcon = booster.currency === 'coins' ? '⭐' : '💎';

    html += '<div style="border: 1px solid #444; border-radius: 8px; padding: 12px; background: rgba(255,255,255,0.03);">';
    html += `<div style="font-size: 20px; margin-bottom: 4px;">${booster.icon}</div>`;
    html += `<div style="font-size: 12px; color: #6cf; margin-bottom: 2px;">${booster.name}</div>`;
    html += `<div style="font-size: 10px; color: #aaa; margin-bottom: 8px;">${booster.desc}</div>`;

    if (quantity > 0) {
      html += `<div style="font-size: 10px; color: #4f4; margin-bottom: 4px;">Owned: ${quantity}</div>`;
    }

    html += `<div class="btn ${!canAfford ? 'disabled' : ''}" onclick="${canAfford ? `purchaseItem('booster', '${booster.id}', ${booster.cost}, null, '${booster.currency}')` : 'void(0)'}" style="padding: 4px 12px; font-size: 11px; width: 100%; ${!canAfford ? 'opacity: 0.5; cursor: not-allowed;' : ''}">${currencyIcon}${booster.cost}</div>`;

function generateCosmeticShopContent() {
  let html = '<div style="margin-bottom: 12px; font-size: 14px; color: #fc4;">Cosmetic Trails</div>';
  html += '<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; max-width: 600px; margin: 0 auto;">';

  TRAILS.forEach(trail => {
    const owned = gs.purchases.owned_trails.includes(trail.id);
    const isActive = gs.purchases.active_trail === trail.id;
    const isFree = trail.unlockType === 'free' || trail.cost === 0;
    const trailCurrency = trail.currency || 'coins';
    const canAfford = isFree || (trailCurrency === 'coins' ? gs.totalCoins >= trail.cost : gs.totalGems >= trail.cost);
    const currencyIcon = trailCurrency === 'coins' ? '⭐' : '💎';

    const colorPreview = trail.color || '#888';
    html += '<div style="border: 1px solid #444; border-radius: 8px; padding: 12px; background: rgba(255,255,255,0.03);">';
    html += `<div style="width: 40px; height: 8px; background: ${colorPreview}; border-radius: 4px; margin-bottom: 6px;"></div>`;
    html += `<div style="font-size: 11px; color: #6cf; margin-bottom: 2px;">${trail.name}</div>`;

    if (isFree) {
      html += '<div style="font-size: 9px; color: #4f4; margin-bottom: 4px;">FREE</div>';
    }

      html += `<div class="btn" onclick="selectTrail('none')" style="padding: 3px 8px; font-size: 10px; width: 100%;">Deactivate</div>`;

    } else {
      html += `<div class="btn ${!canAfford ? 'disabled' : ''}" onclick="${canAfford ? `purchaseItem('cosmetic', '${trail.id}', ${trail.cost}, null, '${trailCurrency}')` : 'void(0)'}" style="padding: 3px 8px; font-size: 10px; width: 100%; ${!canAfford ? 'opacity: 0.5; cursor: not-allowed;' : ''}">${currencyIcon}${trail.cost}</div>`;

  return html;

function purchaseItem(category, itemId, price, skinIndex = null, currency = 'coins') {
  // Check if player has enough currency
  if (currency === 'coins' && gs.totalCoins < price) {
    alert('❌ Not enough coins!');
    return;
  }
  if (currency === 'gems' && gs.totalGems < price) {
    alert('❌ Not enough gems!');
    return;
  }

  // Get item details for confirmation
  let itemName = '';
  if (category === 'skin') {
    itemName = SKINS.find(s => s.id === itemId)?.name || 'Unknown Skin';
  } else if (category === 'booster') {
    itemName = BOOSTERS.find(b => b.id === itemId)?.name || 'Unknown Booster';
  } else if (category === 'cosmetic') {
    itemName = TRAILS.find(c => c.id === itemId)?.name || 'Unknown Cosmetic';
  }

  const currencyIcon = currency === 'coins' ? '⭐' : '💎';
  const confirmMessage = `Purchase ${itemName} for ${currencyIcon}${price}?`;

  if (!confirm(confirmMessage)) {
    return;
  }

  // Deduct currency
  if (currency === 'coins') {
    gs.totalCoins -= price;
    // Also update current level coins if they have any
    if (gs.coins > 0) {
      gs.coins = Math.max(0, gs.coins - price);
    }
  } else {
    gs.totalGems -= price;
    // Also update current level gems if they have any
    if (gs.gems > 0) {
      gs.gems = Math.max(0, gs.gems - price);
    }
  }

  // Add item to inventory
  switch (category) {
    case 'skin':
      if (!gs.ownedSkins.includes(itemId)) {
        gs.ownedSkins.push(itemId);
      }
      break;
    case 'booster':
      const existingBooster = gs.inventory.boosters.find(b => b.id === itemId);
      if (existingBooster) {
        existingBooster.quantity += 1;
      } else {
        gs.inventory.boosters.push({ id: itemId, quantity: 1 });
      }
      break;
    case 'cosmetic':
      if (!gs.purchases.owned_trails.includes(itemId)) {
        gs.purchases.owned_trails.push(itemId);
      }
      // Also add to legacy inventory.cosmetics for backward compatibility
      if (gs.inventory && gs.inventory.cosmetics) {
        const existingCosmetic = gs.inventory.cosmetics.find(c => c.id === itemId);
        if (!existingCosmetic) {
          gs.inventory.cosmetics.push({ id: itemId, quantity: 1, active: false });
        }
      }
      break;
  }

  // Save to localStorage
  saveShopData();

  // Also save to Supabase if logged in
  if (authState && authState.isLoggedIn) {
    if (supabaseClient && currentUser) {
      saveProgress(); // Use Supabase save (async, fire-and-forget)
    }
  }

  // Show success message
  alert(`✅ Successfully purchased ${itemName}!`);

  // Refresh shop display
  showShop();
}

function equipSkin(skinIndex) {
  if (skinIndex >= 0 && skinIndex < SKINS.length) {
    gs.selectedSkin = skinIndex;
    saveGameState();
    showShop(); // Refresh shop to show new equipped state
  }
}

function selectTrail(trailId) {
  gs.purchases.active_trail = trailId;
  saveGameState();
  showShop(); // Refresh shop
}

function activateCosmetic(cosmeticId) {
  // Deactivate all other cosmetics first (only one active at a time)
  gs.inventory.cosmetics.forEach(cosmetic => {
    cosmetic.active = false;
  });

  // Activate the selected cosmetic
  const cosmetic = gs.inventory.cosmetics.find(c => c.id === cosmeticId);
  if (cosmetic) {
    cosmetic.active = true;
    saveShopData();

    // Also save to Supabase if logged in
    if (authState && authState.isLoggedIn && supabaseClient && currentUser) {
      saveProgress();
    }

    showShop(); // Refresh shop display
  }
}

function deactivateCosmetic(cosmeticId) {
  const cosmetic = gs.inventory.cosmetics.find(c => c.id === cosmeticId);
  if (cosmetic) {
    cosmetic.active = false;
    saveShopData();

    // Also save to Supabase if logged in
    if (authState && authState.isLoggedIn && supabaseClient && currentUser) {
      saveProgress();
    }

    showShop(); // Refresh shop display
  }
}

// ═══════════════════════════════════════════════
// SHOP DATA PERSISTENCE
// ═══════════════════════════════════════════════

function saveShopData() {
  const shopData = {
    ownedSkins: gs.ownedSkins,
    inventory: gs.inventory,
    totalCoins: gs.totalCoins,
    totalGems: gs.totalGems,
    selectedSkin: gs.selectedSkin
  };

  try {
    localStorage.setItem('pixelRunner_shop_state', JSON.stringify(shopData));
  } catch (e) {
    console.warn('Could not save shop data:', e);
  }
}

function loadShopData() {
  try {
    const shopData = localStorage.getItem('pixelRunner_shop_state');
    if (shopData) {
      const parsed = JSON.parse(shopData);
      gs.ownedSkins = parsed.ownedSkins || [];
      gs.inventory = parsed.inventory || { boosters: [], cosmetics: [] };

      // Only load currency if it's higher than current (to prevent loss)
      if (parsed.totalCoins > gs.totalCoins) gs.totalCoins = parsed.totalCoins;
      if (parsed.totalGems > gs.totalGems) gs.totalGems = parsed.totalGems;

      if (parsed.selectedSkin !== undefined) gs.selectedSkin = parsed.selectedSkin;
    }
  } catch (e) {
    console.warn('Could not load shop data:', e);
  }
}

function savePurchases() {
  try {
    localStorage.setItem('pixelrunner_purchases', JSON.stringify(gs.purchases));
  } catch (e) {
    console.warn('Could not save purchases:', e);
  }
}

function loadPurchases() {
  try {
    const saved = localStorage.getItem('pixelrunner_purchases');
    if (saved) {
      const parsed = JSON.parse(saved);
      gs.purchases = {
        owned_skins: parsed.owned_skins || ['default'],
        owned_trails: parsed.owned_trails || ['none'],
        active_skin: parsed.active_skin || 'default',
        active_trail: parsed.active_trail || 'none',
        active_boosters: parsed.active_boosters || []
      };
      // Also update selectedSkin for backwards compatibility
      const activeSkinIndex = SKINS.findIndex(s => s.id === gs.purchases.active_skin);
      if (activeSkinIndex >= 0) {
        gs.selectedSkin = activeSkinIndex;
      }
    }
  } catch (e) {
    console.warn('Could not load purchases:', e);
    // Use defaults if loading fails
    gs.purchases = {
      owned_skins: ['default'],
      owned_trails: ['none'],
      active_skin: 'default',
      active_trail: 'none',
      active_boosters: []
    };
  }
}

function showLevelSelect() {
  fadeToMenu(() => {
    gs.phase = 'LEVEL_SELECT';

    let html = '<div style="margin-bottom: 16px; font-size: 18px; color: #6cf;">Select Level</div>';
    html += '<div class="level-grid">';

    // Group levels by theme - dynamic extraction from LEVELS array
    const themes = [...new Set(LEVELS.map(l => l.theme))];

    for (let themeIndex = 0; themeIndex < themes.length; themeIndex++) {
      const theme = themes[themeIndex];
      const themeLevels = LEVELS.filter(l => l.theme === theme);
      if (themeLevels.length === 0) continue;

      // Check if biome is unlocked (need 6/10 levels completed in previous biome)
      let biomeUnlocked = themeIndex === 0; // First biome always unlocked
      if (themeIndex > 0) {
        const prevBiomeTheme = themes[themeIndex - 1];
        const prevBiomeLevels = LEVELS.filter(l => l.theme === prevBiomeTheme);
        const completedInPrevBiome = prevBiomeLevels.filter(l => {
          const progress = gs.levelProgress[l.id];
          return progress && progress.unlocked && progress.stars > 0;
        }).length;
        biomeUnlocked = completedInPrevBiome >= 6;
      }

      // Add biome unlock status to header
      const lockIndicator = biomeUnlocked ? '' : ' 🔒';
      html += `<div class="theme-header">${themeLevels[0].icon} ${theme}${lockIndicator}</div>`;

      for (const level of themeLevels) {
        const progress = gs.levelProgress[level.id];
        const isUnlocked = biomeUnlocked && progress && progress.unlocked;
        const isSelected = level.id === gs.selectedLevelId;
        const stars = progress ? progress.stars : 0;
        const bestScore = progress ? progress.bestScore : 0;

        const cardClass = isSelected ? 'level-card selected' :
                         (isUnlocked ? 'level-card' : 'level-card locked');
        const onclick = isUnlocked ? `onclick="selectLevel(${level.id})"` : '';

        html += `<div class="${cardClass}" ${onclick}>`;
        html += `<div class="level-number">${level.id}</div>`;
        html += `<div class="level-name">${level.name}</div>`;

        if (isUnlocked) {
          // Show stars
          html += '<div class="level-stars">';
          for (let i = 0; i < 3; i++) {
            html += i < stars ? '★' : '☆';
          }
          html += '</div>';

          // Show best score if any
          if (bestScore > 0) {
            html += `<div class="level-score">Best: ${bestScore}</div>`;
          }
        } else {
          // Show unlock requirement
          if (!biomeUnlocked) {
            html += `<div class="level-locked">🔒</div>`;
            html += `<div class="unlock-req">Complete 6 levels in ${themes[themeIndex - 1]}</div>`;
          } else {
            const prevLevel = level.id - 1;
            html += `<div class="level-locked">🔒</div>`;
            html += `<div class="unlock-req">Complete Level ${prevLevel}</div>`;
          }
        }

        html += '</div>';
      }
    }

    html += '</div>';
    html += '<div style="margin: 16px 0;">';
    html += '<div class="btn" onclick="startSelectedLevel()">Start Level</div>';
    html += '<div class="btn" onclick="returnToMenu()">Back to Menu</div>';
    html += '</div>';
    html += '<div style="margin-top: 8px; font-size: 10px; color: #666;">Press ESC to return</div>';

    menuContent.innerHTML = html;
  });
}

function selectLevel(levelId) {
  gs.selectedLevelId = levelId;

function startSelectedLevel() {
  const level = LEVELS.find(l => l.id === gs.selectedLevelId);

}

function claimChallenge(challengeId) {
  const challenge = gs.battlePass.dailyChallenges.find(c => c.id === challengeId);
  if (challenge && challenge.progress >= challenge.target && !challenge.claimed) {
    challenge.claimed = true;
    earnBattlePassXP(challenge.reward, "challenge");
    showBattlePass(); // Refresh the display
  }
}

// ═══════════════════════════════════════════════
// LEVEL GENERATION
// ═══════════════════════════════════════════════
function getLevelWidth(levelNum) {
  // Level 1: 200 tiles, Level 100: 600 tiles (linear increase)
  return 200 + Math.floor((levelNum - 1) * 4.04);
}

function generateLevel(levelNum) {
  const W = getLevelWidth(levelNum);
  const H = CONFIG.LEVEL_HEIGHT_TILES;
  const tiles = Array.from({ length: H }, () => new Array(W).fill(TILE.EMPTY));
  const enemies = [];
  const movingPlatforms = [];

  const groundY = H - 2;
  for (let x = 0; x < W; x++) {
    tiles[groundY][x] = TILE.GRASS;
    tiles[groundY + 1][x] = TILE.STONE;
  }

  // Progressive difficulty scaling for 100 levels
  const gapChance = 0.02 + levelNum * 0.0008;
  const spikeChance = 0.01 + levelNum * 0.0005;
  const enemyChance = 0.008 + levelNum * 0.0003;
  const coinChance = 0.04;
  const gemChance = 0.005 + levelNum * 0.002;
  const powerUpChance = 0.003;

  let lastGap = 0;
  for (let x = 8; x < W - 8; x++) {
    if (Math.random() < gapChance && x - lastGap > 8) {
      const gapW = 3 + Math.floor(Math.random() * (1 + Math.floor(levelNum / 20)));
      for (let gx = x; gx < Math.min(x + gapW, W - 5); gx++) {
        tiles[groundY][gx] = TILE.EMPTY;
        tiles[groundY + 1][gx] = TILE.EMPTY;
      }
      if (Math.random() < 0.7) {
        const py = groundY - 3 - Math.floor(Math.random() * 3);
        for (let px = x; px < Math.min(x + gapW, W - 5); px++) {
          tiles[py][px] = TILE.PLATFORM;
        }
      }
      lastGap = x;
      x += gapW;
      continue;
    }

    if (Math.random() < spikeChance && tiles[groundY][x] === TILE.GRASS) {
      tiles[groundY - 1][x] = TILE.SPIKE;
    }

    if (Math.random() < 0.03) {
      const py = groundY - 4 - Math.floor(Math.random() * 6);
      const pw = 3 + Math.floor(Math.random() * 5);
      for (let px = x; px < Math.min(x + pw, W); px++) {
        if (py >= 2 && py < H) tiles[py][px] = Math.random() < 0.15 ? TILE.BREAKABLE : TILE.GRASS;
      }
      for (let px = x; px < Math.min(x + pw, W); px++) {
        if (Math.random() < 0.4 && py - 1 >= 0) tiles[py - 1][px] = TILE.COIN;
      }
      if (Math.random() < gemChance * 5 && py - 1 >= 0) tiles[py - 1][x + Math.floor(pw / 2)] = TILE.GEM;
    }

    if (Math.random() < coinChance && tiles[groundY][x] === TILE.GRASS) {
      tiles[groundY - 1][x] = TILE.COIN;
    }

    if (Math.random() < gemChance && tiles[groundY][x] === TILE.GRASS) {
      const gy = groundY - 3 - Math.floor(Math.random() * 4);
      if (gy >= 0) tiles[gy][x] = TILE.GEM;
    }

    if (Math.random() < powerUpChance) {
      const py = groundY - 2 - Math.floor(Math.random() * 4);
      if (py >= 0) {
        const types = [TILE.POWERUP_SPEED, TILE.POWERUP_SHIELD, TILE.POWERUP_MAGNET];
        tiles[py][x] = types[Math.floor(Math.random() * types.length)];
      }
    }

    if (Math.random() < enemyChance && tiles[groundY][x] === TILE.GRASS) {
      enemies.push({
        x: x * CONFIG.TILE_SIZE, y: (groundY - 1) * CONFIG.TILE_SIZE,
        type: Math.random() < 0.3 + levelNum * 0.005 ? 'flyer' : 'walker',
        vx: (Math.random() < 0.5 ? 1 : -1) * (1 + (levelNum - 1) * 0.015),
        startX: x * CONFIG.TILE_SIZE,
        patrolRange: (60 + Math.random() * 80),
        frame: 0, alive: true
      });
      if (enemies[enemies.length - 1].type === 'flyer') {
        enemies[enemies.length - 1].y -= (3 + Math.random() * 4) * CONFIG.TILE_SIZE;
        enemies[enemies.length - 1].baseY = enemies[enemies.length - 1].y;
        enemies[enemies.length - 1].flyPhase = Math.random() * Math.PI * 2;
      }
    }

    if (Math.random() < 0.01) {
      movingPlatforms.push({
        x: x * CONFIG.TILE_SIZE, y: (groundY - 5 - Math.floor(Math.random() * 4)) * CONFIG.TILE_SIZE,
        w: (3 + Math.floor(Math.random() * 3)) * CONFIG.TILE_SIZE, h: CONFIG.TILE_SIZE,
        dir: Math.random() < 0.5 ? 'h' : 'v',
        speed: 0.5 + Math.random() * 0.8, phase: Math.random() * Math.PI * 2,
        amplitude: 40 + Math.random() * 60
      });
    }
  }

  tiles[groundY - 1][W - 5] = TILE.EXIT;
  tiles[groundY - 2][W - 5] = TILE.EXIT;

  if (levelNum > 3) {
    for (let x = 20; x < W - 10; x++) {
      if (Math.random() < 0.01 * levelNum) {
        for (let ix = x; ix < Math.min(x + 5 + Math.floor(Math.random() * 8), W); ix++) {
          if (tiles[groundY][ix] === TILE.GRASS) tiles[groundY][ix] = TILE.ICE;
        }
      }
    }
  }

  return { tiles, enemies, movingPlatforms, width: W, height: H };
}

function createPlayer() {

function initializeMovingPlatforms(level) {
  if (!level || !level.movingPlatforms) return;
  for (const mp of level.movingPlatforms) {
    mp.currentX = mp.x;
    mp.currentY = mp.y;
    mp.prevX = mp.x;
    mp.prevY = mp.y;
    mp.deltaX = 0;
    mp.deltaY = 0;
  }
}

// ═══════════════════════════════════════════════
// TILE UTILITIES
// ═══════════════════════════════════════════════
function getTileAt(px, py) {
  const col = Math.floor(px / CONFIG.TILE_SIZE);
  const row = Math.floor(py / CONFIG.TILE_SIZE);
  if (row < 0 || row >= gs.level.height || col < 0 || col >= gs.level.width) return TILE.EMPTY;
  return gs.level.tiles[row][col];
}

function isSolid(tileType) {
  return tileType === TILE.GRASS || tileType === TILE.STONE || tileType === TILE.ICE || tileType === TILE.BREAKABLE;
}

function isOnIce(player) {
  const belowTile = getTileAt(player.x + player.w / 2, player.y + player.h + 1);
  return belowTile === TILE.ICE;
}

// ═══════════════════════════════════════════════
// COLLISION RESOLUTION
// ═══════════════════════════════════════════════
function resolveXCollision(p) {
  const TS = CONFIG.TILE_SIZE;
  const checkYs = [p.y + 1, p.y + p.h / 2, p.y + p.h - 1];

  if (p.vx > 0) {
    const rightEdge = p.x + p.w;
    for (const cy of checkYs) {
      const tile = getTileAt(rightEdge, cy);
      if (isSolid(tile)) {
        const col = Math.floor(rightEdge / TS);
        p.x = col * TS - p.w;
        p.vx = 0;
        break;
      }
    }
  } else if (p.vx < 0) {
    for (const cy of checkYs) {
      const tile = getTileAt(p.x, cy);
      if (isSolid(tile)) {
        const col = Math.floor(p.x / TS);
        p.x = (col + 1) * TS;
        p.vx = 0;
        break;
      }
    }
  }
}

function resolveYCollision(p, oldBottom) {
  const TS = CONFIG.TILE_SIZE;
  const checkXs = [p.x + 1, p.x + p.w / 2, p.x + p.w - 1];

  p.onGround = false;

  if (p.vy > 0) {
    const bottomEdge = p.y + p.h;
    for (const cx of checkXs) {
      const tile = getTileAt(cx, bottomEdge);
      const row = Math.floor(bottomEdge / TS);
      const platformTop = row * TS;

      if (isSolid(tile)) {
        p.y = platformTop - p.h;
        p.vy = 0;
        p.onGround = true;

        // Handle stomp landing effect
        if (p.stompState === 1) {
          p.stompState = 0; // Reset stomp state
          startScreenShake(8, 30); // Strong screen shake for stomp

          // Damage nearby enemies within 2 tiles (64px)
          for (const entity of gs.entities) {
            if (entity.type === 'enemy' && entity.alive) {
              const dx = (entity.x + entity.w/2) - (p.x + p.w/2);
              const dy = (entity.y + entity.h/2) - (p.y + p.h/2);
              const distance = Math.sqrt(dx * dx + dy * dy);

              if (distance < 64) {
                entity.alive = false;
                entity.deathTimer = 10;
                gs.score += 50; // Bonus points for stomp kill

                // Create stomp kill particles
                for (let i = 0; i < 8; i++) {
                  gs.particles.push({
                    x: entity.x + entity.w/2,
                    y: entity.y + entity.h/2,
                    vx: Math.random() * 6 - 3,
                    vy: Math.random() * 4 - 2,
                    color: '#f84',
                    size: 2 + Math.random() * 2,
                    life: 25,
                    maxLife: 25
                  });
                }
              }
            }
          }

          // Create ground impact particles
          for (let i = 0; i < 12; i++) {
            gs.particles.push({
              x: p.x + p.w/2 + Math.random() * 16 - 8,
              y: p.y + p.h,
              vx: Math.random() * 8 - 4,
              vy: -Math.random() * 6 - 2,
              color: '#a84',
              size: 2 + Math.random() * 2,
              life: 30,
              maxLife: 30
            });
          }
        }

        break;
      }
      if (tile === TILE.PLATFORM && oldBottom <= platformTop + 2) {
        p.y = platformTop - p.h;
        p.vy = 0;
        p.onGround = true;

        // Reset stomp state when landing on any surface
        if (p.stompState === 1) {
          p.stompState = 0;
        }

        break;
      }
    }
  } else if (p.vy < 0) {
    for (const cx of checkXs) {
      const tile = getTileAt(cx, p.y);
      if (isSolid(tile)) {
        const row = Math.floor(p.y / TS);
        p.y = (row + 1) * TS;
        p.vy = 0;
        if (tile === TILE.BREAKABLE) {
          gs.level.tiles[row][Math.floor(cx / TS)] = TILE.EMPTY;
        }
        break;
      }
    }
  }
}

// ═══════════════════════════════════════════════
// TILE INTERACTIONS
// ═══════════════════════════════════════════════
function checkTilePickups(p) {
  const TS = CONFIG.TILE_SIZE;
  const startCol = Math.floor(p.x / TS);
  const endCol = Math.floor((p.x + p.w - 1) / TS);
  const startRow = Math.floor(p.y / TS);
  const endRow = Math.floor((p.y + p.h - 1) / TS);

  for (let row = startRow; row <= endRow; row++) {
    for (let col = startCol; col <= endCol; col++) {
      if (row < 0 || row >= gs.level.height || col < 0 || col >= gs.level.width) continue;
      const tile = gs.level.tiles[row][col];

      if (tile === TILE.COIN) {
        gs.coins++; gs.score += 10;
        gs.level.tiles[row][col] = TILE.EMPTY;
        // Add coin collection particle burst
        spawnCollectionParticles(col * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE/2, row * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE/2, '#ff0', 6);
        // Battle pass XP and challenge progress
        earnBattlePassXP(5, "coin_collection");
        updateChallengeProgress("coins", 1);
      } else if (tile === TILE.GEM) {
        gs.gems++; gs.score += 50;
        gs.level.tiles[row][col] = TILE.EMPTY;
        // Add gem collection particle burst
        spawnCollectionParticles(col * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE/2, row * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE/2, '#4ef', 10);
        // Battle pass XP and challenge progress
        earnBattlePassXP(25, "gem_collection");
      } else if (tile === TILE.POWERUP_SPEED) {
        gs.powerUps.speed = 600;
        gs.level.tiles[row][col] = TILE.EMPTY;
      } else if (tile === TILE.POWERUP_SHIELD) {
        gs.player.shieldHP = gs.player.shieldMax || 1;
        gs.level.tiles[row][col] = TILE.EMPTY;
      } else if (tile === TILE.POWERUP_MAGNET) {
        gs.powerUps.magnet = 600;
        gs.level.tiles[row][col] = TILE.EMPTY;
      }
    }
  }
}

function checkSpikeCollision(p) {
  const TS = CONFIG.TILE_SIZE;
  const checkPoints = [
    [p.x + 2, p.y + p.h - 2],
    [p.x + p.w - 2, p.y + p.h - 2],
    [p.x + p.w / 2, p.y + p.h - 1]
  ];
  for (const [cx, cy] of checkPoints) {
    if (getTileAt(cx, cy) === TILE.SPIKE) {
      if (p.invincible > 0) return;
      if (p.shieldHP > 0) { p.shieldHP--; p.invincible = 60; return; }
      gs.lastDeathCause = 'spike';
      killPlayer();
      return;
    }
  }
}

function checkExitCollision(p) {
  const TS = CONFIG.TILE_SIZE;
  const cx = p.x + p.w / 2;
  const cy = p.y + p.h / 2;
  if (getTileAt(cx, cy) === TILE.EXIT) {
    const totalScore = Math.floor(gs.score) + gs.coins * 10 + gs.gems * 50;
    completeLevel(gs.levelNum, totalScore);
    showLevelCompleteScreen(gs.levelNum, totalScore);
  }
}
