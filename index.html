// ═══════════════════════════════════════════════
// PLAYER UPDATE
// ═══════════════════════════════════════════════
function updatePlayer() {
  const p = gs.player;
  if (!p || !p.alive) return;

  const oldY = p.y;
  const oldBottom = oldY + p.h;

  if (p.invincible > 0) p.invincible--;
  if (gs.powerUps.speed > 0) gs.powerUps.speed--;
  if (gs.powerUps.shield > 0) gs.powerUps.shield--;
  if (gs.powerUps.magnet > 0) gs.powerUps.magnet--;
  if (p.wallJumpCooldown > 0) p.wallJumpCooldown--;

  // Handle time slow mechanics
  if (gs.timeSlowTimer > 0) {
    gs.timeSlowTimer--;
    gs.timeScale = 0.3;
  } else {
    gs.timeScale = 1.0;
  }
  if (gs.timeSlowCooldown > 0) gs.timeSlowCooldown--;

  // Time slow activation
  const hasTimeSlow = gs.unlockedSkills.includes('time_slow');
  const timeSlowBuffered = (frameCount - lastTimeSlowPress) < 4;
  if (hasTimeSlow && timeSlowBuffered && gs.timeSlowCooldown <= 0 && gs.timeSlowTimer <= 0) {
    gs.timeSlowTimer = 180; // 6 seconds at 30fps
    gs.timeSlowCooldown = 300; // 10 seconds cooldown
    lastTimeSlowPress = -100;
  }

  // Ground Pound (Stomp) activation
  const hasStomp = gs.unlockedSkills.includes('stomp');
  const downPressed = keys['ArrowDown'] || keys['KeyS'];
  if (hasStomp && downPressed && !p.onGround && p.vy > 0 && p.stompState === 0) {
    // Check if player is at least 64px above ground
    const playerBottom = p.y + p.h;
    let nearestGroundY = gs.level.height * CONFIG.TILE_SIZE;

    for (let row = Math.floor(playerBottom / CONFIG.TILE_SIZE); row < gs.level.height; row++) {
      for (let col = Math.floor(p.x / CONFIG.TILE_SIZE); col <= Math.floor((p.x + p.w) / CONFIG.TILE_SIZE); col++) {
        if (col >= 0 && col < gs.level.width && row >= 0) {
          const tile = gs.level.tiles[row][col];
          if (isSolid(tile)) {
            nearestGroundY = Math.min(nearestGroundY, row * CONFIG.TILE_SIZE);
            break;
          }
        }
      }
      if (nearestGroundY < gs.level.height * CONFIG.TILE_SIZE) break;
    }

    if (playerBottom < nearestGroundY - 64) {
      p.stompState = 1; // Activate stomp
      p.vy = 15; // Fast downward velocity
    }
  }

  // Handle dash mechanics
  if (p.dashTimer > 0) {
    p.dashTimer--;
    // During dash, maintain dash velocity
    p.vx = p.dashDir * CONFIG.DASH_SPEED;
    // Apply skin dash bonus if available
    if (p.skin && p.skin.bonus === 'dash') {
      p.vx *= 1.3;
    }
  } else {
    // Normal movement when not dashing
    const onIce = isOnIce(p);
    const wantLeft = keys['ArrowLeft'] || keys['KeyA'];
    const wantRight = keys['ArrowRight'] || keys['KeyD'];

    // Apply skin speed bonus
    let baseSpeed = CONFIG.PLAYER_SPEED;
    if (p.skin && p.skin.bonus === 'speed') baseSpeed *= 1.1;
    if (gs.powerUps.speed > 0) baseSpeed *= 1.3;

    if (onIce) {
      if (wantLeft) { p.vx -= 0.15; p.facing = -1; }
      else if (wantRight) { p.vx += 0.15; p.facing = 1; }
      else { p.vx *= 0.96; }
      p.vx = Math.max(-baseSpeed, Math.min(p.vx, baseSpeed));
      if (Math.abs(p.vx) < 0.1 && !wantLeft && !wantRight) p.vx = 0;
    } else {
      if (wantLeft) { p.vx = -baseSpeed; p.facing = -1; }
      else if (wantRight) { p.vx = baseSpeed; p.facing = 1; }
      else { p.vx = 0; }
    }
  }

  // Handle dash activation
  const hasDash = gs.unlockedSkills.includes('dash');
  const dashBuffered = (frameCount - lastDashPress) < 4; // 4 frame buffer for dash input
  if (hasDash && dashBuffered && p.canDash && p.dashTimer <= 0) {
    p.dashTimer = CONFIG.DASH_FRAMES;
    p.dashDir = p.facing;
    p.canDash = false;
    p.invincible = Math.max(p.invincible, 10); // Brief invincibility during dash
    lastDashPress = -100; // Clear dash buffer
    
    // Create dash effect particles
    for (let i = 0; i < 5; i++) {
      gs.particles.push({
        x: p.x + p.w/2 + Math.random() * 8 - 4,
        y: p.y + p.h/2 + Math.random() * 8 - 4,
        vx: -p.dashDir * (2 + Math.random() * 3),
        vy: Math.random() * 2 - 1,
        color: '#ff8',
        size: 2 + Math.random() * 2,
        life: 15,
        maxLife: 15
      });
    }
  }

  p.vy += CONFIG.GRAVITY;

  // Handle glide skill mechanics
  const hasGlide = gs.unlockedSkills.includes('glide');
  const jumpHeld = keys['Space'] || keys['ArrowUp'] || keys['KeyW'];
  const isGliding = hasGlide && jumpHeld && p.vy > 1.5 && !p.onGround;

  if (isGliding) {
    p.vy = 1.5; // Cap fall speed for gliding
    // Add gliding particles
    if (frameCount % 4 === 0) {
      gs.particles.push({
        x: p.x + p.w/2 + Math.random() * 8 - 4,
        y: p.y + p.h + Math.random() * 4,
        vx: Math.random() * 2 - 1,
        vy: Math.random() * 1 + 1,
        color: '#8ef',
        size: 1,
        life: 30,
        maxLife: 30
      });
    }
  } else {
    if (p.vy > CONFIG.MAX_FALL_SPEED) p.vy = CONFIG.MAX_FALL_SPEED;
  }

  p.x += p.vx;
  p.x = Math.max(0, Math.min(p.x, gs.level.width * CONFIG.TILE_SIZE - p.w));

  const oldVx = p.vx;
  resolveXCollision(p);

  // Handle wall jump skill mechanics
  const hasWallJump = gs.unlockedSkills.includes('wall_jump');
  const jumpBuffered = (frameCount - lastJumpPress) < CONFIG.JUMP_BUFFER_FRAMES;
  const hitWall = oldVx !== 0 && p.vx === 0; // Player was moving but now stopped by wall

  if (hasWallJump && jumpBuffered && hitWall && p.vy > 0 && !p.onGround && p.wallJumpCooldown <= 0) {
    // Wall jump: apply upward velocity and push away from wall
    p.vy = CONFIG.JUMP_VELOCITY * 0.9; // Slightly weaker than normal jump
    p.vx = oldVx > 0 ? -CONFIG.PLAYER_SPEED * 1.5 : CONFIG.PLAYER_SPEED * 1.5; // Push away from wall
    p.wallJumpCooldown = 10; // Prevent infinite climbing on same wall
    p.facing = p.vx > 0 ? 1 : -1; // Face away from wall
    lastJumpPress = -100; // Clear jump buffer

    // Create wall jump effect particles
    for (let i = 0; i < 6; i++) {
      gs.particles.push({
        x: p.x + p.w/2 + Math.random() * 6 - 3,
        y: p.y + p.h/2 + Math.random() * 6 - 3,
        vx: oldVx > 0 ? -Math.random() * 3 : Math.random() * 3,
        vy: -Math.random() * 4 - 1,
        color: '#8ff',
        size: 2,
        life: 20,
        maxLife: 20
      });
    }
  }

  p.y += p.vy;

  // Handle magnet skill mechanics
  const hasMagnet = gs.unlockedSkills.includes('magnet');
  if (hasMagnet) {
    const MAGNET_RANGE = 80;
    const MAGNET_SPEED = 3;
    const playerCenterX = p.x + p.w / 2;
    const playerCenterY = p.y + p.h / 2;

    for (let row = 0; row < gs.level.height; row++) {
      for (let col = 0; col < gs.level.width; col++) {
        const tile = gs.level.tiles[row][col];
        if (tile === TILE.COIN || tile === TILE.GEM) {
          const tileX = col * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE / 2;
          const tileY = row * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE / 2;
          const dx = tileX - playerCenterX;
          const dy = tileY - playerCenterY;
          const distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < MAGNET_RANGE && distance > 5) {
            // Move tile content toward player
            const moveX = (-dx / distance) * MAGNET_SPEED;
            const moveY = (-dy / distance) * MAGNET_SPEED;

            // Create attraction particle effect
            if (frameCount % 3 === 0) {
              gs.particles.push({
                x: tileX + Math.random() * 6 - 3,
                y: tileY + Math.random() * 6 - 3,
                vx: moveX * 0.3 + Math.random() * 2 - 1,
                vy: moveY * 0.3 + Math.random() * 2 - 1,
                color: tile === TILE.COIN ? '#ff0' : '#0f8',
                size: 1,
                life: 20,
                maxLife: 20
              });
            }
          }
        }
      }
    }
  }

  if (p.y > gs.level.height * CONFIG.TILE_SIZE + 50) {
    gs.lastDeathCause = 'fall';
    killPlayer();
    return;
  }

  const wasAbove = oldBottom;
  resolveYCollision(p, wasAbove);
  checkMovingPlatformCollision(p);

  if (p.onGround) {
    p.coyoteTimer = CONFIG.COYOTE_FRAMES;
    p.jumpsLeft = p.maxJumps;
    p.canDash = true; // Reset dash ability when landing
  } else {
    if (p.coyoteTimer > 0) p.coyoteTimer--;
  }

  const jumpBufferedNormal = (frameCount - lastJumpPress) < CONFIG.JUMP_BUFFER_FRAMES;
  if (jumpBufferedNormal && (p.onGround || p.coyoteTimer > 0) && p.jumpsLeft > 0) {
    // Apply skin jump bonus
    let jumpVel = CONFIG.JUMP_VELOCITY;
    if (p.skin && p.skin.bonus === 'jump') jumpVel *= 1.12;
    p.vy = jumpVel;
    p.onGround = false;
    p.coyoteTimer = 0;
    p.jumpsLeft--;
    lastJumpPress = -100;
    
    // Create jump effect particles for double jump
    if (p.maxJumps > 1 && p.jumpsLeft === 0) {
      for (let i = 0; i < 8; i++) {
        gs.particles.push({
          x: p.x + p.w/2 + Math.random() * 12 - 6,
          y: p.y + p.h + Math.random() * 4,
          vx: Math.random() * 4 - 2,
          vy: Math.random() * 2 + 1,
          color: '#4af',
          size: 1 + Math.random() * 2,
          life: 20,
          maxLife: 20
        });
      }
    }
  }

  if (p.onGround && Math.abs(p.vx) > 0.5) {
    p.frameTimer++;
    if (p.frameTimer >= 8) { p.frame = (p.frame + 1) % 4; p.frameTimer = 0; }
  } else {
    p.frame = 0; p.frameTimer = 0;
  }

  checkTilePickups(p);
  checkSpikeCollision(p);
  checkExitCollision(p);

  scoreTracker.award(gs.progressBase + p.x + p.w);
  gs.score = scoreTracker.getHighWater();
}

function updateMovingPlatforms() {
  if (!gs.level || !gs.level.movingPlatforms) return;
  for (const mp of gs.level.movingPlatforms) {
    mp.prevX = mp.currentX !== undefined ? mp.currentX : mp.x;
    mp.prevY = mp.currentY !== undefined ? mp.currentY : mp.y;

    if (mp.dir === 'h') {
      mp.currentX = mp.x + Math.sin(frameCount * mp.speed * 0.02 + mp.phase) * mp.amplitude;
      mp.currentY = mp.y;
    } else if (mp.dir === 'v') {
      mp.currentX = mp.x;
      mp.currentY = mp.y + Math.sin(frameCount * mp.speed * 0.02 + mp.phase) * mp.amplitude;
    } else {
      mp.currentX = mp.prevX;
      mp.currentY = mp.prevY;
    }

    mp.deltaX = mp.currentX - mp.prevX;
    mp.deltaY = mp.currentY - mp.prevY;
  }
}

function checkMovingPlatformCollision(player) {
  if (!player || !gs.level || !gs.level.movingPlatforms) return;
  const p = player;
  p._onMovingPlatform = false;

  for (const mp of gs.level.movingPlatforms) {
    if (mp.currentX === undefined || mp.currentY === undefined) continue;

    const platTop = mp.currentY;
    const platLeft = mp.currentX;
    const platRight = platLeft + mp.w;

    if (p.vy < 0) continue;
    if (p.x + p.w <= platLeft || p.x >= platRight) continue;

    const playerBottom = p.y + p.h;
    if (playerBottom < platTop || playerBottom > platTop + 10) continue;

    const prevBottom = playerBottom - p.vy;
    if (prevBottom > platTop + 2) continue;

    p.y = platTop - p.h;
    p.vy = 0;
    p.onGround = true;
    p.coyoteTimer = CONFIG.COYOTE_FRAMES;
    p.jumpsLeft = p.maxJumps;
    p.canDash = true;

    if (Math.abs(mp.deltaX) > 0) {
      const newX = p.x + mp.deltaX;
      const checkX = mp.deltaX > 0 ? newX + p.w : newX;
      const midY = p.y + p.h / 2;
      if (!isSolid(getTileAt(checkX, midY))) {
        p.x = newX;
      }
    }

    p._onMovingPlatform = true;
    break;
  }
}

// ═══════════════════════════════════════════════
// PARTICLE SYSTEM
// ═══════════════════════════════════════════════
function updateParticles() {
  for (let i = gs.particles.length - 1; i >= 0; i--) {
    const particle = gs.particles[i];

    // Update position
    particle.x += particle.vx;
    particle.y += particle.vy;

    // Apply gravity to particles
    particle.vy += 0.1;

    // Update life
    particle.life--;

    // Remove dead particles
    if (particle.life <= 0) {
      gs.particles.splice(i, 1);
    }
  }
}

function updateTrailParticles() {
  const p = gs.player;
  if (!p || !p.alive) return;

  // Spawn trail particles every 3 frames if active trail is not 'none'
  const activeTrail = gs.purchases.active_trail;
  if (activeTrail && activeTrail !== 'none' && frameCount % 3 === 0) {
    // Find the trail data
    const trail = TRAILS.find(t => t.id === activeTrail);
    if (trail) {
      // Spawn particle at player position
      gs.trailParticles.push({
        x: p.x + p.w / 2,
        y: p.y + p.h / 2,
        color: trail.color,
        life: 15
      });
    }
  }

  // Update and remove trail particles
  for (let i = gs.trailParticles.length - 1; i >= 0; i--) {
    const particle = gs.trailParticles[i];
    particle.life--;

    // Remove particle if life is over
    if (particle.life <= 0) {
      gs.trailParticles.splice(i, 1);
    }
  }

  // Limit to max 30 particles
  while (gs.trailParticles.length > 30) {
    gs.trailParticles.shift(); // Remove oldest particle
  }
}

function spawnCollectionParticles(x, y, color, count) {
  // Limit total particles to 50
  if (gs.particles.length + count > 50) {
    const removeCount = gs.particles.length + count - 50;
    gs.particles.splice(0, removeCount);
  }

  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
    const speed = 2 + Math.random() * 3;
    const lifetime = color === '#ff0' ? 25 : 35; // Coins fade faster than gems

    gs.particles.push({
      x: x,
      y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 1, // Slight upward bias
      life: lifetime,
      maxLife: lifetime,
      color: color,
      size: 2 + Math.random() * 2,
      type: 'collection'
    });
  }
}

// ═══════════════════════════════════════════════
// ENEMY UPDATES
// ═══════════════════════════════════════════════
function updateEnemies() {
  for (const e of gs.entities) {
    if (!e.alive) {
      if (e.deathTimer !== undefined && e.deathTimer > 0) {
        e.deathTimer--;
      }
      continue;
    }

    if (e.type === 'walker') {
      e.x += e.vx * gs.timeScale;

      if (e.x < e.startX - e.patrolRange) {
        e.vx = Math.abs(e.vx);
      } else if (e.x > e.startX + e.patrolRange) {
        e.vx = -Math.abs(e.vx);
      }

      const wallCheckX = e.vx > 0 ? e.x + 16 : e.x - 1;
      if (isSolid(getTileAt(wallCheckX, e.y + 8))) {
        e.vx = -e.vx;
      }

      const ledgeCheckX = e.vx > 0 ? e.x + 16 : e.x - 1;
      const tileBelow = getTileAt(ledgeCheckX, e.y + 17);
      if (!isSolid(tileBelow) && tileBelow !== TILE.PLATFORM) {
        e.vx = -e.vx;
      }

      e.frame = (e.frame + 0.1 * gs.timeScale) % 2;

    } else if (e.type === 'flyer') {
      e.flyPhase += 0.03 * gs.timeScale;
      e.y = e.baseY + Math.sin(e.flyPhase) * 20;

      e.x += e.vx * 0.5 * gs.timeScale;
      if (e.x < e.startX - e.patrolRange) {
        e.vx = Math.abs(e.vx);
      } else if (e.x > e.startX + e.patrolRange) {
        e.vx = -Math.abs(e.vx);
      }

      e.frame = (e.frame + 0.08 * gs.timeScale) % 2;
    }
  }

  if (frameCount % 60 === 0) {
    gs.entities = gs.entities.filter(e => e.alive || (e.deathTimer !== undefined && e.deathTimer > 0));
  }
}

// ═══════════════════════════════════════════════
// ENEMY COLLISION CHECK
// ═══════════════════════════════════════════════
function checkEnemyCollision() {
  const p = gs.player;
  if (!p || !p.alive || p.invincible > 0) return;

  for (const e of gs.entities) {
    if (!e.alive) continue;

    const ew = 16, eh = 16;
    if (p.x + p.w > e.x && p.x < e.x + ew &&
        p.y + p.h > e.y && p.y < e.y + eh) {

      const feetOverlap = (p.y + p.h) - e.y;
      const isDashing = p.dashTimer > 0;
      
      if ((p.vy > 0 && feetOverlap < 10) || isDashing) {
        // Kill enemy via stomp or dash
        e.alive = false;
        e.deathTimer = 10;
        if (!isDashing) {
          p.vy = CONFIG.JUMP_VELOCITY * 0.6; // Bounce on stomp
        }
        gs.score += 25;

        // Battle pass XP for enemy kill
        earnBattlePassXP(10, "enemy_kill");
        
        // Create death particles
        for (let i = 0; i < 6; i++) {
          gs.particles.push({
            x: e.x + 8 + Math.random() * 8 - 4,
            y: e.y + 8 + Math.random() * 8 - 4,
            vx: Math.random() * 4 - 2,
            vy: Math.random() * 3 - 1,
            color: '#f44',
            size: 1 + Math.random() * 2,
            life: 25,
            maxLife: 25
          });
        }
      } else {
        // Player takes damage
        if (p.shieldHP > 0) {
          p.shieldHP--;
          p.invincible = 60;
          startScreenShake(4, 12); // Light shake for shield hit
        } else {
          startScreenShake(6, 20); // Stronger shake for death
          gs.lastDeathCause = 'enemy';
          killPlayer();
        }
      }
      return;
    }
  }
}

// ═══════════════════════════════════════════════
// SCREEN SHAKE SYSTEM
// ═══════════════════════════════════════════════
function startScreenShake(intensity, frames) {
  if (gs.phase !== 'PLAYING') return; // Don't shake during menus
  gs.shakeIntensity = intensity;
  gs.shakeFrames = frames;
}

function updateScreenShake() {
  if (gs.shakeFrames > 0) {
    gs.shakeFrames--;
    const decay = gs.shakeFrames / 20; // Decay over 20 frames
    const currentIntensity = gs.shakeIntensity * decay;

    const shakeX = (Math.random() - 0.5) * currentIntensity * 2;
    const shakeY = (Math.random() - 0.5) * currentIntensity * 2;

    canvas.style.transform = `translate(${shakeX}px, ${shakeY}px)`;

    if (gs.shakeFrames <= 0) {
      canvas.style.transform = 'translate(0px, 0px)'; // Reset to center
    }
  }
}

// ═══════════════════════════════════════════════
// MENU TRANSITIONS
// ═══════════════════════════════════════════════
function transitionTo(callback) {
  if (gs.transition.active) return; // Lock to prevent interruptions

  // For menu-to-menu transitions (no canvas game loop running), use CSS fade
  if (gs.phase !== 'PLAYING' && gs.phase !== 'DEAD') {
    const overlay = document.getElementById('game-container') || document.getElementById('menu-content');
    if (overlay) {
      overlay.style.transition = 'opacity 0.3s ease';
      overlay.style.opacity = '0';
      setTimeout(() => {
        if (callback) callback();
        overlay.style.opacity = '1';
      }, 300);
    } else {
      if (callback) callback();
    }
    return;
  }

  // Canvas-based transition for gameplay
  gs.transition.active = true;
  gs.transition.direction = 'out';
  gs.transition.callback = callback;
  gs.transition.alpha = 0;

  const fadeOut = () => {
    gs.transition.alpha += gs.transition.speed;

    if (gs.transition.alpha >= 1) {
      if (gs.transition.callback) {
        gs.transition.callback();
      }

      gs.transition.direction = 'in';
      const fadeIn = () => {
        gs.transition.alpha -= gs.transition.speed;

        if (gs.transition.alpha <= 0) {
          gs.transition.active = false;
          gs.transition.callback = null;
          return;
        }

        requestAnimationFrame(fadeIn);
      };
      requestAnimationFrame(fadeIn);
      return;
    }

    requestAnimationFrame(fadeOut);
  };

  requestAnimationFrame(fadeOut);
}

// Legacy function for compatibility
function fadeToMenu(callback) {
  transitionTo(callback);
}

// ═══════════════════════════════════════════════
// MENU STACK MANAGEMENT
// ═══════════════════════════════════════════════
function pushMenuStack(currentPhase) {
  if (gs.menuStack.length >= 10) {
    gs.menuStack.shift(); // Remove oldest entry if stack too large
  }
  gs.menuStack.push(currentPhase);
}

function popMenuStack() {
  return gs.menuStack.pop() || 'MENU';
}

function handleEscapeKey() {
  if (gs.transition.active) return; // Don't process ESC during transitions

  if (gs.phase === 'PLAYING') {
    if (gs.isPaused) {
      resumeFromPause();
    } else {
      openPauseMenu();
    }
    return;
  } else if (gs.phase === 'DEAD') {
    // Return to menu from death screen
    transitionTo(() => {
      gs.phase = 'MENU';
      showMainMenu();
    });
  } else if (gs.menuStack.length > 0) {
    // Navigate back using menu stack
    const previousScreen = popMenuStack();
    transitionTo(() => {
      switch (previousScreen) {
        case 'MENU':
          gs.phase = 'MENU';
          showMainMenu();
          break;
        case 'LEVEL_SELECT':
          gs.phase = 'LEVEL_SELECT';
          showLevelSelect();
          break;
        case 'PLAYING':
          // Resume game
          gs.phase = 'PLAYING';
          overlay.classList.add('hidden');
          gs.isPaused = false;
          break;
        default:
          gs.phase = 'MENU';
          showMainMenu();
      }
    });
  }
}

function formatLevelTime(seconds = 0) {
  const totalSeconds = Math.max(0, Math.floor(seconds));
  const minutes = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
  const secs = (totalSeconds % 60).toString().padStart(2, '0');
  return `${minutes}:${secs}`;
}

function openPauseMenu() {
  if (gs.phase !== 'PLAYING' || gs.isPaused) return;
  gs.isPaused = true;
  canvas.style.transform = 'translate(0px, 0px)'; // Ensure canvas recenters while paused
  overlay.classList.remove('hidden');

  const levelName = LEVELS.find(l => l.id === gs.levelNum)?.name || `Level ${gs.levelNum}`;
  const summaryText = `${levelName} • Time ${formatLevelTime(gs.levelTime)} • Score ${Math.floor(gs.score)}`;

  menuContent.innerHTML = `
    <div style="text-align: center; max-width: 360px;">
      <div style="font-size: 28px; color: #6cf; margin-bottom: 12px;">⏸ Game Paused</div>
      <div style="font-size: 12px; color: #aaa; margin-bottom: 20px;">${summaryText}</div>
      <div class="btn" onclick="resumeFromPause()">Resume</div>
      <div class="btn" onclick="restartLevelFromPause()">Restart Level</div>
      <div class="btn" onclick="quitToMenuFromPause()">Quit to Menu</div>
      <div style="font-size: 10px; color: #666; margin-top: 16px;">Press ESC to resume</div>
    </div>
  `;
}

function resumeFromPause() {
  if (gs.phase !== 'PLAYING' || !gs.isPaused) return;
  gs.isPaused = false;
  overlay.classList.add('hidden');
  menuContent.innerHTML = '';
}

function restartLevelFromPause() {
  if (gs.phase !== 'PLAYING') return;
  if (gs.transition.active) return;
  gs.isPaused = false;
  overlay.classList.add('hidden');
  menuContent.innerHTML = '';
  transitionTo(() => {
    startGame();
  });
}

function quitToMenuFromPause() {
  if (gs.phase !== 'PLAYING') return;
  if (gs.transition.active) return;
  gs.isPaused = false;
  menuContent.innerHTML = '';
  returnToMenu();
}

// ═══════════════════════════════════════════════
// BACK BUTTON RENDERING
// ═══════════════════════════════════════════════
function renderBackButton(targetScreen) {
  return `
    <div style="position: absolute; top: 10px; left: 10px; z-index: 20;">
      <div class="btn" style="
        padding: 8px 12px;
        font-size: 12px;
        background: rgba(0,0,0,0.7);
        border: 1px solid #666;
        min-width: 80px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
      " onclick="navigateBack('${targetScreen}')">
        ← Back
      </div>
    </div>
  `;
}

function navigateBack(targetScreen) {
  if (gs.transition.active) return;

  transitionTo(() => {
    switch (targetScreen) {
      case 'MENU':
        gs.phase = 'MENU';
        showMainMenu();
        break;
      case 'LEVEL_SELECT':
        gs.phase = 'LEVEL_SELECT';
        showLevelSelect();
        break;
      default:
        gs.phase = 'MENU';
        showMainMenu();
    }
  });
}

// ═══════════════════════════════════════════════
// CONFETTI PARTICLE SYSTEM
// ═══════════════════════════════════════════════
function createConfetti() {
  gs.confetti = []; // Clear existing confetti

  const colors = ['#ff4444', '#44ff44', '#4444ff', '#ffff44', '#ff44ff', '#44ffff'];

  for (let i = 0; i < 30; i++) {
    gs.confetti.push({
      x: CONFIG.CANVAS_WIDTH / 2 + (Math.random() - 0.5) * 200,
      y: CONFIG.CANVAS_HEIGHT / 2 + (Math.random() - 0.5) * 100,
      vx: (Math.random() - 0.5) * 8,
      vy: (Math.random() - 0.5) * 8 - 2,
      gravity: 0.2,
      life: 120,
      maxLife: 120,
      color: colors[Math.floor(Math.random() * colors.length)]
    });
  }
}

function updateConfetti() {
  for (let i = gs.confetti.length - 1; i >= 0; i--) {
    const particle = gs.confetti[i];

    particle.x += particle.vx;
    particle.y += particle.vy;
    particle.vy += particle.gravity;
    particle.life--;

    if (particle.life <= 0) {
      gs.confetti.splice(i, 1);
    }
  }
}

function playZoomEffect() {
  canvas.classList.add('play-zoom');
  setTimeout(() => {
    canvas.classList.remove('play-zoom');
  }, 200);
}

// ═══════════════════════════════════════════════
// DEATH HANDLER
// ═══════════════════════════════════════════════
function killPlayer() {
  gs.player.alive = false;
  gs.deathCount++;
  gs.phase = 'DEAD';

  // Auto-save progress if logged in
  if (authState && authState.isLoggedIn) {
    if (supabaseClient && currentUser) {
      saveProgress(); // Use Supabase save (async, fire-and-forget)
    } else {
      savePlayerProgress(authState.email); // Fallback to localStorage
    }
  }

  // Calculate final scores and show enhanced game over screen
  calculateFinalScore();
  showGameOverScreen();
}

function calculateFinalScore() {
  // Calculate distance score (already in gs.score)
  const distanceScore = Math.floor(gs.score);
  const coinBonus = gs.coins * 10;
  const gemBonus = gs.gems * 50;
  const totalScore = distanceScore + coinBonus + gemBonus;

  // Calculate XP earned this run
  const xpEarned = Math.floor(totalScore / 10) + (gs.coins * 2) + (gs.gems * 5);

  // Check for new best score
  const isNewBest = totalScore > gs.bestScore;
  if (isNewBest) {
    gs.bestScore = totalScore;
    // Save to localStorage (will be implemented by auth system later)
    try {
      localStorage.setItem('pixelRunnerBestScore', gs.bestScore.toString());
    } catch (e) {
      console.warn('Could not save best score:', e);
    }
  }

  // Check level completion and update progress
  const currentLevel = LEVELS.find(l => l.id === gs.levelNum);
  if (currentLevel) {
    completeLevel(currentLevel.id, totalScore);
  }

  // Battle Pass progression
  const battlePassXP = Math.floor(totalScore / 10); // 1 XP per 10 score points
  earnBattlePassXP(battlePassXP, "level_completion");

  // Update challenge progress
  updateChallengeProgress("score", totalScore);
  updateChallengeProgress("levels", 1);
  updateChallengeProgress("coins", gs.coins);

  // Store values for game over screen
  gs.gameOverData = {
    distanceScore,
    coinBonus,
    gemBonus,
    totalScore,
    xpEarned,
    isNewBest,
    starRating: getStarRating(totalScore)
  };
}

function getStarRating(score) {
  if (score >= 5000) return 3;
  if (score >= 2000) return 2;
  if (score >= 500) return 1;
  return 0;
}

function applyXPGain(xpEarned) {
  const startXP = gs.xp;
  const startLevel = gs.playerLevel;
  let currentXP = startXP;
  let currentLevel = startLevel;

  // Add the earned XP
  currentXP += xpEarned;

  // Check for level ups
  let leveledUp = false;
  while (currentXP >= xpForLevel(currentLevel)) {
    currentXP -= xpForLevel(currentLevel);
    currentLevel++;
    leveledUp = true;
  }

  // Update game state
  gs.xp = currentXP;
  gs.playerLevel = currentLevel;

  if (leveledUp) {
    // Check for new skill unlocks
    checkSkillUnlocks();
    console.log(`Level up! Now level ${currentLevel}`);
  }

  // Animate the XP bar
  animateXPBar();
}

function animateXPBar() {
  const xpFill = document.getElementById('gameover-xp-fill');
  if (!xpFill) return;

  const currentXP = gs.xp;
  const xpToNext = xpForLevel(gs.playerLevel);
  const percentage = Math.min((currentXP / xpToNext) * 100, 100);

  // Start from 0 and animate to final percentage
  xpFill.style.width = '0%';
  setTimeout(() => {
    xpFill.style.width = percentage + '%';
  }, 100);
}

function getCurrentLevelTheme() {
  const currentLevel = LEVELS.find(l => l.id === gs.levelNum);
  if (currentLevel) {
    return currentLevel.theme.toLowerCase();
  }
  return 'forest'; // Default fallback
}

function applyThemeColors() {
  const themeName = getCurrentLevelTheme();
  const theme = THEMES[themeName];
  if (theme && theme.tileColors) {
    // Apply theme-specific tile colors
    Object.assign(TILE_COLORS, theme.tileColors);
  }
}

let _parallaxLayers = null;

function initParallaxLayers() {
  _parallaxLayers = {
    far: [],
    mid: []
  };

  // Generate far layer shapes (mountains for forest, skyscrapers for city)
  for (let x = 0; x < CONFIG.CANVAS_WIDTH * 6; x += 40) {
    _parallaxLayers.far.push({
      x: x,
      height: 60 + Math.random() * 80,
      width: 30 + Math.random() * 50,
      type: 'mountain'
    });
  }

  // Generate mid layer shapes (trees for forest, buildings for city)
  for (let x = 0; x < CONFIG.CANVAS_WIDTH * 6; x += 25) {
    _parallaxLayers.mid.push({
      x: x,
      height: 30 + Math.random() * 60,
      width: 15 + Math.random() * 25,
      type: 'tree'
    });
  }
}

function getCurrentTheme() {
  return getCurrentLevelTheme();
}

function renderBackground() {
  if (!_parallaxLayers) initParallaxLayers();

  const theme = THEMES[getCurrentTheme()];

  // 1. Render sky gradient
  const grad = ctx.createLinearGradient(0, 0, 0, CONFIG.CANVAS_HEIGHT);
  grad.addColorStop(0, theme.sky[0]);
  grad.addColorStop(0.5, theme.sky[1]);
  grad.addColorStop(1, theme.sky[2]);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);

  // 2. Render far layer (mountains/skyscrapers)
  ctx.fillStyle = theme.far.color;
  for (const shape of _parallaxLayers.far) {
    const x = ((shape.x - gs.camera.x * theme.far.speed) % (CONFIG.CANVAS_WIDTH * 6) + CONFIG.CANVAS_WIDTH * 6) % (CONFIG.CANVAS_WIDTH * 6);
    if (x > -shape.width && x < CONFIG.CANVAS_WIDTH) {
      if (getCurrentTheme() === 'forest') {
        // Draw mountain silhouette
        ctx.beginPath();
        ctx.moveTo(x, CONFIG.CANVAS_HEIGHT);
        ctx.lineTo(x, CONFIG.CANVAS_HEIGHT - shape.height);
        ctx.lineTo(x + shape.width * 0.3, CONFIG.CANVAS_HEIGHT - shape.height - 20);
        ctx.lineTo(x + shape.width * 0.7, CONFIG.CANVAS_HEIGHT - shape.height - 10);
        ctx.lineTo(x + shape.width, CONFIG.CANVAS_HEIGHT - shape.height + 15);
        ctx.lineTo(x + shape.width, CONFIG.CANVAS_HEIGHT);
        ctx.fill();
      } else {
        // Draw skyscraper silhouette
        ctx.fillRect(x, CONFIG.CANVAS_HEIGHT - shape.height, shape.width, shape.height);
        // Add some window details
        ctx.fillStyle = theme.far.color + '44';
        for (let wy = CONFIG.CANVAS_HEIGHT - shape.height + 10; wy < CONFIG.CANVAS_HEIGHT - 10; wy += 12) {
          for (let wx = x + 4; wx < x + shape.width - 4; wx += 8) {
            ctx.fillRect(wx, wy, 2, 2);
          }
        }
        ctx.fillStyle = theme.far.color;
      }
    }
  }

  // 3. Render mid layer (trees/buildings)
  ctx.fillStyle = theme.mid.color;
  for (const shape of _parallaxLayers.mid) {
    const x = ((shape.x - gs.camera.x * theme.mid.speed) % (CONFIG.CANVAS_WIDTH * 6) + CONFIG.CANVAS_WIDTH * 6) % (CONFIG.CANVAS_WIDTH * 6);
    if (x > -shape.width && x < CONFIG.CANVAS_WIDTH) {
      if (getCurrentTheme() === 'forest') {
        // Draw tree silhouette
        const trunkWidth = 4;
        const trunkHeight = shape.height * 0.3;
        const crownHeight = shape.height * 0.7;
        // Trunk
        ctx.fillRect(x + shape.width/2 - trunkWidth/2, CONFIG.CANVAS_HEIGHT - trunkHeight, trunkWidth, trunkHeight);
        // Crown (triangle)
        ctx.beginPath();
        ctx.moveTo(x + shape.width/2, CONFIG.CANVAS_HEIGHT - trunkHeight - crownHeight);
        ctx.lineTo(x, CONFIG.CANVAS_HEIGHT - trunkHeight);
        ctx.lineTo(x + shape.width, CONFIG.CANVAS_HEIGHT - trunkHeight);
        ctx.fill();
      } else {
        // Draw building silhouette
        ctx.fillRect(x, CONFIG.CANVAS_HEIGHT - shape.height, shape.width, shape.height);
      }
    }
  }
}

function updateCamera() {
  const targetX = gs.player.x - CONFIG.CANVAS_WIDTH / 2 + gs.player.w / 2;
  const targetY = Math.max(0, gs.player.y - CONFIG.CANVAS_HEIGHT * 0.65);
  gs.camera.x += (targetX - gs.camera.x) * CONFIG.CAMERA_LERP;
  gs.camera.x = Math.max(0, Math.min(gs.camera.x, gs.level.width * CONFIG.TILE_SIZE - CONFIG.CANVAS_WIDTH));
  gs.camera.y += (targetY - gs.camera.y) * CONFIG.CAMERA_LERP;
  gs.camera.y = Math.max(0, Math.min(gs.camera.y, Math.max(0, gs.level.height * CONFIG.TILE_SIZE - CONFIG.CANVAS_HEIGHT)));
}

// ═══════════════════════════════════════════════
// RENDERING - TILES
// ═══════════════════════════════════════════════
function renderTiles() {
  const TS = CONFIG.TILE_SIZE;
  const startCol = Math.max(0, Math.floor(gs.camera.x / TS) - 1);
  const endCol = Math.min(gs.level.width, Math.ceil((gs.camera.x + CONFIG.CANVAS_WIDTH) / TS) + 1);
  const startRow = Math.max(0, Math.floor(gs.camera.y / TS) - 1);
  const endRow = Math.min(gs.level.height, Math.ceil((gs.camera.y + CONFIG.CANVAS_HEIGHT) / TS) + 1);

  for (let row = startRow; row < endRow; row++) {
    for (let col = startCol; col < endCol; col++) {
      const tile = gs.level.tiles[row][col];
      if (tile === TILE.EMPTY) continue;

      const sx = col * TS - gs.camera.x;
      const sy = row * TS - gs.camera.y;

      if (tile === TILE.GRASS) {
        ctx.fillStyle = TILE_COLORS[tile][0];
        ctx.fillRect(sx, sy, TS, TS);
        ctx.fillStyle = TILE_COLORS[tile][1];
        ctx.fillRect(sx, sy + TS - 2, TS, 2);
        const h = ((col * 7 + row * 13) & 0x7FFFFFFF) % 4;
        ctx.fillStyle = '#6c5';
        ctx.fillRect(sx + h * 4, sy + 2, 2, 2);
      } else if (tile === TILE.STONE) {
        ctx.fillStyle = TILE_COLORS[tile][0];
        ctx.fillRect(sx, sy, TS, TS);
        ctx.strokeStyle = TILE_COLORS[tile][1];
        ctx.lineWidth = 1;
        for (let y = sy; y < sy + TS; y += 4) {
          ctx.beginPath();
          ctx.moveTo(sx, y);
          ctx.lineTo(sx + TS, y);
          ctx.stroke();
        }
        for (let x = sx; x < sx + TS; x += 4) {
          ctx.beginPath();
          ctx.moveTo(x, sy);
          ctx.lineTo(x, sy + TS);
          ctx.stroke();
        }
      } else if (tile === TILE.SPIKE) {
        ctx.fillStyle = TILE_COLORS[tile][0];
        ctx.beginPath();
        ctx.moveTo(sx + TS / 2, sy);
        ctx.lineTo(sx + TS, sy + TS);
        ctx.lineTo(sx, sy + TS);
        ctx.closePath();
        ctx.fill();
      } else if (tile === TILE.ICE) {
        ctx.fillStyle = TILE_COLORS[tile][0];
        ctx.fillRect(sx, sy, TS, TS);
        ctx.fillStyle = '#fff';
        ctx.fillRect(sx + 2, sy + 2, 3, 2);
        ctx.fillRect(sx + 10, sy + 8, 4, 2);
      } else if (tile === TILE.BREAKABLE) {
        ctx.fillStyle = TILE_COLORS[tile][0];
        ctx.fillRect(sx, sy, TS, TS);
        ctx.strokeStyle = TILE_COLORS[tile][1];
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(sx + 4, sy + 4);
        ctx.lineTo(sx + 12, sy + 12);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(sx + 12, sy + 4);
        ctx.lineTo(sx + 4, sy + 12);
        ctx.stroke();
      } else if (tile === TILE.PLATFORM) {
        ctx.fillStyle = TILE_COLORS[tile][0];
        ctx.fillRect(sx, sy, TS, TS);
        ctx.fillStyle = '#9c7';
        ctx.fillRect(sx, sy, TS, 1);
        ctx.fillStyle = TILE_COLORS[tile][1];
        ctx.fillRect(sx, sy + TS - 1, TS, 1);
      } else if (tile === TILE.COIN) {
        const bobY = sy + Math.sin(frameCount * 0.08 + col) * 2;
        ctx.fillStyle = '#ff0';
        ctx.beginPath();
        ctx.arc(sx + TS / 2, bobY + TS / 2, 3, 0, Math.PI * 2);
        ctx.fill();
      } else if (tile === TILE.GEM) {
        ctx.fillStyle = '#4ef';
        ctx.beginPath();
        ctx.moveTo(sx + TS / 2, sy + 2);
        ctx.lineTo(sx + TS - 2, sy + TS / 2);
        ctx.lineTo(sx + TS / 2, sy + TS - 2);
        ctx.lineTo(sx + 2, sy + TS / 2);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#2cd';
        ctx.lineWidth = 1;
        ctx.stroke();
      } else if (tile === TILE.POWERUP_SPEED) {
        const scale = 1 + Math.sin(frameCount * 0.06) * 0.1;
        const r = 4 * scale;
        ctx.fillStyle = '#4f4';
        ctx.beginPath();
        ctx.arc(sx + TS / 2, sy + TS / 2, r, 0, Math.PI * 2);
        ctx.fill();
      } else if (tile === TILE.POWERUP_SHIELD) {
        const scale = 1 + Math.sin(frameCount * 0.06) * 0.1;
        const r = 4 * scale;
        ctx.fillStyle = '#48f';
        ctx.beginPath();
        ctx.arc(sx + TS / 2, sy + TS / 2, r, 0, Math.PI * 2);
        ctx.fill();
      } else if (tile === TILE.POWERUP_MAGNET) {
        const scale = 1 + Math.sin(frameCount * 0.06) * 0.1;
        const r = 4 * scale;
        ctx.fillStyle = '#f4f';
        ctx.beginPath();
        ctx.arc(sx + TS / 2, sy + TS / 2, r, 0, Math.PI * 2);
        ctx.fill();
      } else if (tile === TILE.EXIT) {
        const pulse = Math.sin(frameCount * 0.04);
        ctx.fillStyle = pulse > 0 ? '#ff0' : '#fc0';
        ctx.fillRect(sx + 2, sy + 2, TS - 4, TS - 4);
        ctx.strokeStyle = pulse > 0 ? '#fc0' : '#ff0';
        ctx.lineWidth = 1;
        ctx.strokeRect(sx + 2, sy + 2, TS - 4, TS - 4);
      }
    }
  }
}

// ═══════════════════════════════════════════════
// RENDERING - MOVING PLATFORMS
// ═══════════════════════════════════════════════
function renderMovingPlatforms() {
  for (const p of gs.level.movingPlatforms) {
    const vx = p.currentX !== undefined ? p.currentX : p.x;
    const vy = p.currentY !== undefined ? p.currentY : p.y;

    const px = vx - gs.camera.x;
    const py = vy - gs.camera.y;

    ctx.fillStyle = TILE_COLORS[TILE.PLATFORM][0];
    ctx.fillRect(px, py, p.w, p.h);
    ctx.fillStyle = '#9c7';
    ctx.fillRect(px, py, p.w, 1);
    ctx.fillStyle = TILE_COLORS[TILE.PLATFORM][1];
    ctx.fillRect(px, py + p.h - 1, p.w, 1);
  }
}

// ═══════════════════════════════════════════════
// RENDERING - PARTICLES
// ═══════════════════════════════════════════════
function renderParticles() {
  for (const particle of gs.particles) {
    const alpha = particle.life / (particle.maxLife || particle.life || 1);
    const screenX = particle.x - gs.camera.x;
    const screenY = particle.y - gs.camera.y;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = particle.color;

    if (particle.type === 'collection') {
      // Draw circular particles for collection effects
      ctx.beginPath();
      ctx.arc(screenX, screenY, particle.size || 2, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Draw rectangular particles (existing behavior)
      ctx.fillRect(screenX, screenY, particle.size || 2, particle.size || 2);
    }

    ctx.restore();
  }
}

function renderTrailParticles() {
  for (const particle of gs.trailParticles) {
    const alpha = particle.life / 15; // Fade over 15 frames
    const screenX = particle.x - gs.camera.x;
    const screenY = particle.y - gs.camera.y;

    ctx.save();
    ctx.globalAlpha = alpha * 0.7; // Max alpha 0.7 for trail effect
    ctx.fillStyle = particle.color;
    ctx.beginPath();
    ctx.arc(screenX, screenY, 3, 0, Math.PI * 2); // Small circle for trail
    ctx.fill();
    ctx.restore();
  }
}

// ═══════════════════════════════════════════════
// RENDERING - ENTITIES
// ═══════════════════════════════════════════════
function renderEntities() {
  for (const e of gs.entities) {
    if (!e.alive && (e.deathTimer === undefined || e.deathTimer <= 0)) continue;

    if (!e.alive && e.deathTimer > 0) {
      if (e.deathTimer % 2 === 0) continue;
    }

    const ex = e.x - gs.camera.x;
    const ey = e.y - gs.camera.y;

    if (e.type === 'walker') {
      ctx.fillStyle = '#f44';
      ctx.fillRect(ex, ey, 16, 8);
      ctx.fillStyle = '#fff';
      ctx.fillRect(ex + 3, ey + 2, 2, 2);
      ctx.fillRect(ex + 11, ey + 2, 2, 2);
      ctx.fillStyle = '#d22';
      ctx.fillRect(ex + 2, ey + 8, 3, 4);
      ctx.fillRect(ex + 11, ey + 8, 3, 4);
    } else if (e.type === 'flyer') {
      ctx.fillStyle = '#85f';
      ctx.fillRect(ex + 3, ey + 2, 10, 8);
      const wingL = Math.sin(frameCount * 0.15) * 3;
      const wingR = Math.sin(frameCount * 0.15 + Math.PI) * 3;
      ctx.fillStyle = '#a6f';
      ctx.fillRect(ex + 1, ey + 3 + wingL, 2, 4);
      ctx.fillRect(ex + 13, ey + 3 + wingR, 2, 4);
    }
  }
}

// ═══════════════════════════════════════════════
// RENDERING - PLAYER
// ═══════════════════════════════════════════════
function renderPlayer() {
  const p = gs.player;
  if (!p) return;

  if (p.invincible > 0 && frameCount % 4 < 2) return;

  // Use the player's skin colors for rendering
  let skinColors;
  if (p.skin.colors) {
    // Old format with colors array
    skinColors = p.skin.colors;
  } else if (p.skin.color === 'rainbow') {
    // Rainbow skin: cycle hue each frame
    const hue = frameCount % 360;
    const rainbowColor = `hsl(${hue}, 70%, 50%)`;
    skinColors = [rainbowColor, rainbowColor, '#fff', '#fc4', '#333'];
  } else {
    // New format with single color, create colors array
    const baseColor = p.skin.color;
    skinColors = [baseColor, baseColor, '#fff', '#fc4', '#333'];
  }
  const sprite = makePlayerSprite(skinColors, p.frame);
  drawSprite(sprite, p.x - gs.camera.x, p.y - gs.camera.y, 1, p.facing === -1);

  // Render shield effect if active
  if (p.shieldHP > 0) {
    ctx.save();
    ctx.globalAlpha = 0.3 + Math.sin(frameCount * 0.2) * 0.1;
    ctx.fillStyle = '#4ef';
    ctx.beginPath();
    ctx.arc(p.x - gs.camera.x + p.w / 2, p.y - gs.camera.y + p.h / 2, 20, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Render dash effect
  if (p.dashTimer > 0) {
    ctx.save();
    ctx.globalAlpha = 0.6;
    ctx.fillStyle = '#ff8';
    for (let i = 1; i <= 3; i++) {
      const trailX = p.x - gs.camera.x - p.dashDir * i * 4;
      ctx.globalAlpha = 0.6 / i;
      drawSprite(sprite, trailX, p.y - gs.camera.y, 1, p.facing === -1);
    }
    ctx.restore();
  }
}

// ═══════════════════════════════════════════════
// RENDERING - MAIN
// ═══════════════════════════════════════════════
function render() {
  ctx.clearRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);

  if (gs.phase === 'MENU') {
    ctx.fillStyle = '#1a1a3a';
    ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
    ctx.fillStyle = '#6cf';
    ctx.font = '32px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('PIXEL RUNNER', CONFIG.CANVAS_WIDTH / 2, CONFIG.CANVAS_HEIGHT / 2);
    ctx.font = '16px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText('Ready to play!', CONFIG.CANVAS_WIDTH / 2, CONFIG.CANVAS_HEIGHT / 2 + 40);
  } else if (gs.phase === 'SKIN_SELECT') {
    ctx.fillStyle = '#1a1a3a';
    ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
    ctx.fillStyle = '#6cf';
    ctx.font = '28px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('SKIN SELECTION', CONFIG.CANVAS_WIDTH / 2, CONFIG.CANVAS_HEIGHT / 2 - 60);
    ctx.font = '14px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText('Choose your appearance and bonus', CONFIG.CANVAS_WIDTH / 2, CONFIG.CANVAS_HEIGHT / 2 - 30);
  } else if (gs.phase === 'SKILL_SELECT') {
    ctx.fillStyle = '#1a1a3a';
    ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
    ctx.fillStyle = '#6cf';
    ctx.font = '28px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('SKILLS', CONFIG.CANVAS_WIDTH / 2, CONFIG.CANVAS_HEIGHT / 2 - 60);
    ctx.font = '14px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText('Your unlocked abilities', CONFIG.CANVAS_WIDTH / 2, CONFIG.CANVAS_HEIGHT / 2 - 30);
  } else if (gs.phase === 'LEVEL_SELECT') {
    ctx.fillStyle = '#1a1a3a';
    ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
    ctx.fillStyle = '#6cf';
    ctx.font = '28px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('LEVEL SELECT', CONFIG.CANVAS_WIDTH / 2, CONFIG.CANVAS_HEIGHT / 2 - 60);
    ctx.font = '14px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText('Choose your adventure', CONFIG.CANVAS_WIDTH / 2, CONFIG.CANVAS_HEIGHT / 2 - 30);
  } else if (gs.phase === 'SHOP') {
    ctx.fillStyle = '#1a1a3a';
    ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
    ctx.fillStyle = '#6cf';
    ctx.font = '28px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('COIN SHOP', CONFIG.CANVAS_WIDTH / 2, CONFIG.CANVAS_HEIGHT / 2 - 60);
    ctx.font = '14px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText('Spend your hard-earned currency', CONFIG.CANVAS_WIDTH / 2, CONFIG.CANVAS_HEIGHT / 2 - 30);
  } else if (gs.phase === 'BATTLE_PASS') {
    ctx.fillStyle = '#1a1a3a';
    ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
    ctx.fillStyle = '#fc4';
    ctx.font = '28px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('BATTLE PASS', CONFIG.CANVAS_WIDTH / 2, CONFIG.CANVAS_HEIGHT / 2 - 60);
    ctx.font = '14px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText('Season progression and rewards', CONFIG.CANVAS_WIDTH / 2, CONFIG.CANVAS_HEIGHT / 2 - 30);
  } else if (gs.phase === 'PLAYING') {
    updateCamera();
    renderBackground();
    renderTiles();
    renderMovingPlatforms();
    renderTrailParticles();
    renderEntities();
    renderPlayer();
    renderParticles();
    renderCanvasHUD();
    updateHUD();

    // Render enhanced level progress bar
    if (gs.level) {
      const levelWidthPx = gs.level.width * CONFIG.TILE_SIZE;
      const progress = Math.min(1, gs.player.x / levelWidthPx);
      const progressPercent = Math.floor(progress * 100);

      // Background bar
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0, 0, canvas.width, 4);

      // Progress gradient bar
      if (progress > 0) {
        const gradient = ctx.createLinearGradient(0, 0, canvas.width * progress, 0);
        gradient.addColorStop(0, '#ff4444');    // Red at start
        gradient.addColorStop(0.5, '#ffff44');  // Yellow at middle
        gradient.addColorStop(1, '#44ff44');    // Green at end

        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width * progress, 4);
      }

      // Diamond marker at current position
      const markerX = canvas.width * progress;
      ctx.fillStyle = '#fff';
      ctx.save();
      ctx.translate(markerX, 2);
      ctx.rotate(Math.PI / 4);
      ctx.fillRect(-2, -2, 4, 4);
      ctx.restore();

      // Percentage label
      ctx.fillStyle = '#fff';
      ctx.font = '12px monospace';
      ctx.textAlign = 'right';
      ctx.fillText(`${progressPercent}%`, canvas.width - 5, 15);
    }
  } else if (gs.phase === 'DEAD') {
    updateCamera();
    renderBackground();
    renderTiles();
    renderMovingPlatforms();
    renderTrailParticles();
    renderEntities();
    renderPlayer();
    renderParticles();
    // Apply dark overlay to frozen game scene
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
    // Game over screen is now handled by HTML overlay, not canvas text
  }

  // Render transition overlay if active
  if (gs.transition.active) {
    ctx.fillStyle = `rgba(0,0,0,${gs.transition.alpha})`;
    ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
  }

  // Render confetti particles
  if (gs.confetti.length > 0) {
    for (const particle of gs.confetti) {
      ctx.save();
      ctx.globalAlpha = particle.life / particle.maxLife;
      ctx.fillStyle = particle.color;
      ctx.fillRect(particle.x - gs.camera.x, particle.y - gs.camera.y, 3, 3);
      ctx.restore();
    }
  }
}

// ═══════════════════════════════════════════════
// GAME LOOP
// ═══════════════════════════════════════════════
function gameLoop() {
  frameCount++;
  if (gs.phase === 'PLAYING') {
    if (!gs.isPaused) {
      gs.levelTime += 1/60; // Track level time (assuming 60 FPS)
      updateMovingPlatforms();
      updateEnemies();
      updatePlayer();
      updateTrailParticles();
      updateParticles();
      updateConfetti();
      checkEnemyCollision();
      updateScreenShake();
    }
  } else if (gs.phase === 'DEAD') {
    updateScreenShake();
  }
  render();
  requestAnimationFrame(gameLoop);
}

// ═══════════════════════════════════════════════
// GAME INITIALIZATION
// ═══════════════════════════════════════════════
window.startGame = startGame;
function startGame() {
  // Play zoom effect before starting
  playZoomEffect();
  gs.isPaused = false;

  // Check for new skill unlocks based on current player level
  checkSkillUnlocks();

  // Apply theme-specific colors for the current level
  applyThemeColors();

  gs.level = generateLevel(gs.levelNum);
  initializeMovingPlatforms(gs.level);
  gs.player = createPlayer();
  gs.entities = [...gs.level.enemies];
  gs.particles = [];
  gs.floatingTexts = [];
  gs.powerUps = { speed: 0, shield: 0, magnet: 0 };
  gs.camera = { x: 0, y: 0 };
  gs.shakeFrames = 0;
  gs.levelTime = 0;
  gs.progressBase = 0;

  // Apply unlocked skills to player
  const hasDoubleJump = gs.unlockedSkills.includes('double_jump');
  const hasShield = gs.unlockedSkills.includes('shield');
  gs.player.maxJumps = hasDoubleJump ? 2 : 1;
  gs.player.jumpsLeft = gs.player.maxJumps;
  if (hasShield) {
    gs.player.shieldHP = 1;
    gs.player.shieldMax = 1;
    const selectedSkin = getSafeSelectedSkin(); // Use validated skin selection
    if (selectedSkin.bonus === 'shield_dur') gs.player.shieldMax = 2;
  }

  gs.phase = 'PLAYING';

  // Reset score state for new run
  gs.score = 0;
  gs.coins = 0;
  gs.gems = 0;

  overlay.classList.add('hidden');
  initHUD();

  scoreTracker.reset(gs.progressBase + gs.player.x + gs.player.w);
}

function init() {
  gs.phase = 'MENU';
  gs.isPaused = false;
  overlay.classList.remove('hidden');

  // Initialize default game state
  resetGameStateToDefaults();

  // Load level progress from localStorage
  loadLevelProgress();

  // Load shop data from localStorage
  loadShopData();

  // Set up Supabase auth state monitoring
  initializeSupabaseAuth();

  // Show login screen instead of main menu
  showLoginScreen();
  gameLoop();
}

async function initializeSupabaseAuth() {
  if (!supabaseClient || !SUPABASE_CONFIGURED) {
    return; // No Supabase configured
  }

  try {
    // Check if user is already logged in
    const { data: { user }, error } = await supabaseClient.auth.getUser();

    if (error) {
      console.error('Auth check error:', error);
      return;
    }

    if (user) {
      // User is logged in, restore session
      currentUser = user;
      authState = authState || {};
      authState.isLoggedIn = true;
      authState.email = user.email;

      // Load progress from Supabase
      await loadProgress();

      // Update UI
      updateLoggedInIndicator();
    }

    // Set up auth state change listener
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_IN' && session?.user) {
        currentUser = session.user;
        authState = authState || {};
        authState.isLoggedIn = true;
        authState.email = session.user.email;
        updateLoggedInIndicator();
        loadProgress();
      } else if (event === 'SIGNED_OUT') {
        currentUser = null;
        if (authState) {
          const auth = getAuthFunctions();
          if (auth) {
            auth.applyLogout(authState);
          }
          authState.email = '';
        }
        updateLoggedInIndicator();
      }
    });

  } catch (error) {
    console.error('Supabase initialization error:', error);
  }
}

canvas.addEventListener('click', () => {
  if (gs.phase === 'DEAD') startGame();
});

init();
</script>
<script>
// Auth-state functions inlined to avoid separate module fetch
// (sandbox proxy returns 503 for secondary .js module imports)
(function() {
  const EMAIL_PATTERN = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const AUTH_MESSAGES = {
    idle: 'Enter your email and password to continue.',
    submitting: 'Signing you in...',
    success: 'Signed in. Enjoy the run!',
    genericFailure: 'Mock authentication failed. Try again.',
    requiredEmail: 'Email is required.',
    invalidEmail: 'Enter a valid email address.',
    requiredPassword: 'Password is required.',
  };
  function createInitialAuthState(overrides) {
    return Object.assign({ isLoggedIn: false, status: 'idle', message: AUTH_MESSAGES.idle, error: '', email: '' }, overrides || {});
  }
  function validateLoginInput(email, password) {
    var normalizedEmail = email.trim(), errors = {};
    if (!normalizedEmail) errors.email = AUTH_MESSAGES.requiredEmail;
    else if (!EMAIL_PATTERN.test(normalizedEmail)) errors.email = AUTH_MESSAGES.invalidEmail;
    if (!password) errors.password = AUTH_MESSAGES.requiredPassword;
    return { errors: errors, normalizedEmail: normalizedEmail };
  }
  function applyLoginSuccess(state) { state.status='success'; state.isLoggedIn=true; state.error=''; state.message=AUTH_MESSAGES.success; return state; }
  function applyLoginFailure(state, message) { state.status='failure'; state.isLoggedIn=false; state.error=message||AUTH_MESSAGES.genericFailure; state.message=state.error; return state; }
  function applyLogout(state) { var r=createInitialAuthState(); state.isLoggedIn=r.isLoggedIn; state.status=r.status; state.message=r.message; state.error=r.error; state.email=''; return state; }
  function shouldShowIndicator(state) { return !!state.isLoggedIn; }
  function getIndicatorLabel(state) { return state.email || 'Logged in'; }
  window.AuthFunctions = { AUTH_MESSAGES:AUTH_MESSAGES, createInitialAuthState:createInitialAuthState, validateLoginInput:validateLoginInput, applyLoginSuccess:applyLoginSuccess, applyLoginFailure:applyLoginFailure, applyLogout:applyLogout, shouldShowIndicator:shouldShowIndicator, getIndicatorLabel:getIndicatorLabel };
})();
</script>
