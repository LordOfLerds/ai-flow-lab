project_name: ai-flow-lab
truth_sources:
  - CLAUDE.md
  - AGENTS.md
  - knowledge/
entry_points:
  - index.html
  - game.html
lanes:
  analysis-lane:
    default_executor: claude
    read_only: true
    branch_prefix: analysis/
  bug-lane:
    default_executor: claude
    read_only: false
    branch_prefix: bug/
  feature-lane:
    default_executor: codex
    read_only: false
    branch_prefix: feature/
  danger-lane:
    default_executor: claude
    read_only: false
    branch_prefix: danger/
    requires_human_before_pr: true
  docs-lane:
    default_executor: claude
    read_only: false
    branch_prefix: docs/
  test-lane:
    default_executor: codex
    read_only: false
    branch_prefix: test/
human_gates:
  before_merge_main: true
  before_prod_deploy: true
  before_destructive_migration: true

cascade:
  max_depth: 3
  max_followups_per_task: 2
  max_total_tasks: 8

executor_routing:
  default:
    architect: openai
    critique: gemini
    synthesize: openai
    execute: codex
    followups: openai
    pr_draft: openai
  overrides:
    bug-lane:
      execute: claude
    danger-lane:
      execute: claude
    docs-lane:
      execute: claude
    analysis-lane:
      synthesize: claude
      execute: claude
chatgpt_chat_url: "https://chatgpt.com/g/g-p-69bebafb1cbc8191bc43956a609fc017-aurena-wbs/c/69d896c8-6814-8384-8132-4d5dc11f5664"
