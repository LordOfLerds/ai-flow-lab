<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pixel Runner – Auth Smoke Tests</title>
<style>
:root {
  color-scheme: light dark;
  font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
}
body {
  margin: 0;
  padding: 24px;
  background: #0b111a;
  color: #e4edf7;
}
header {
  margin-bottom: 18px;
}
header h1 {
  font-size: 22px;
  margin: 0 0 10px 0;
}
header p {
  margin: 4px 0;
  font-size: 13px;
  line-height: 1.4;
  color: #8fa4c3;
}
main {
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
}
button {
  border: 1px solid #3a8ef6;
  background: #14253d;
  color: #e4edf7;
  padding: 8px 16px;
  font-family: inherit;
  font-size: 13px;
  border-radius: 6px;
  cursor: pointer;
}
button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
#summary {
  font-size: 13px;
  color: #9cb8e7;
}
.workspace {
  display: grid;
  grid-template-columns: minmax(320px, 640px) minmax(260px, 1fr);
  gap: 14px;
}
iframe {
  width: 100%;
  min-height: 520px;
  border: 1px solid #1f2a3d;
  border-radius: 8px;
  background: #050910;
}
.log-panel {
  border: 1px solid #1f2a3d;
  border-radius: 8px;
  padding: 12px;
  background: #0f1826;
  max-height: 540px;
  overflow-y: auto;
}
.log-panel h2 {
  font-size: 14px;
  margin: 0 0 10px 0;
  color: #9cb8e7;
}
#test-log {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
#test-log li {
  border: 1px solid #22324a;
  border-radius: 6px;
  padding: 10px;
  background: #111b2c;
  font-size: 13px;
}
#test-log li .name {
  font-weight: 600;
}
#test-log li .category {
  font-size: 12px;
  color: #6b83ad;
}
.badge {
  display: inline-block;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 999px;
  margin-left: 8px;
}
.badge.pending { background: #3b3f55; color: #d6dff2; }
.badge.pass { background: #1d5c3b; color: #b9ffd0; }
.badge.fail { background: #5c1d2c; color: #ffc7d3; }
.details {
  margin-top: 6px;
  font-size: 12px;
  color: #b0c2e1;
  white-space: pre-wrap;
}
.notice {
  font-size: 12px;
  color: #b0c2e1;
  margin-top: 6px;
}
@media (max-width: 980px) {
  .workspace {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>
<header>
  <h1>Pixel Runner — Auth Smoke Tests</h1>
  <p>Open this page via a local HTTP server (not <code>file://</code>) so the iframe can inspect <code>index.html</code>.</p>
  <p>Use the controls below to run the vanilla-JS test suite against the live mock authentication UI.</p>
</header>
<main>
  <section class="controls">
    <button id="run-all">Run All Tests</button>
    <button id="reload-game">Reload Game Frame</button>
    <span id="summary">Idle</span>
  </section>
  <section class="workspace">
    <iframe id="game-frame" title="Pixel Runner under test" src="../index.html"></iframe>
    <div class="log-panel">
      <h2>Test Log</h2>
      <ol id="test-log"></ol>
      <div class="notice">Pass/fail updates appear here while the suite runs.</div>
    </div>
  </section>
</main>
<script type="module" src="./auth-smoke-tests.js"></script>
</body>
</html>
