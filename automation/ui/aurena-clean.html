<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURENA · Auktionen ohne Limit</title>
<style>
  :root{
    --cyan:#1aa0d8; --cyan-deep:#1684b4; --cyan-dark:#0f6a92;
    --lime:#9fc63a; --lime-deep:#86ab2b;
    --ink:#0d3b50; --ink2:#46728a; --white:#fff;
    --bg:#ecf6fb; --bg2:#dceef7;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5;overflow-x:hidden}
  h1{font-weight:800;letter-spacing:-.02em;line-height:1.02}
  ::selection{background:rgba(159,198,58,.4)}
  .wrap{max-width:1180px;margin:0 auto;padding:0 32px}

  .nav{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:18px 32px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;color:var(--cyan);letter-spacing:-.01em}
  .brand .dot{color:var(--lime)}
  .brand .badge{width:30px;height:30px;border-radius:50%;background:var(--cyan);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
  .nav .links{display:flex;gap:22px;align-items:center}
  .nav a{color:var(--ink2);text-decoration:none;font-size:14px;font-weight:600}.nav a:hover{color:var(--ink)}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--lime);color:#1b2e07;font-weight:800;font-size:14px;padding:11px 20px;border-radius:999px;text-decoration:none;box-shadow:0 8px 22px rgba(159,198,58,.35);transition:transform .15s}
  .btn:hover{transform:translateY(-2px)}

  .hero{min-height:100vh;display:grid;grid-template-columns:1.02fr .98fr;align-items:center;gap:24px;position:relative;overflow:hidden}
  .hero::before{content:"";position:absolute;width:140vmax;height:140vmax;right:-46vmax;top:-30vmax;border-radius:50%;
    background:radial-gradient(circle at 50% 50%, #fff 0%, #eaf6fb 38%, transparent 60%);z-index:0}
  .hero-copy{position:relative;z-index:2}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan-dark);background:#fff;border:1px solid #cfe6f1;padding:7px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(16,90,120,.06)}
  .hero h1{font-size:clamp(44px,7.4vw,104px);margin:22px 0 0;color:var(--ink)}
  .hero h1 .cyan{color:var(--cyan)}
  .hero h1 .lime{color:var(--lime-deep)}
  .hero .sub{margin-top:22px;font-size:clamp(16px,1.5vw,20px);color:var(--ink2);max-width:46ch}
  .hero .actions{margin-top:34px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .ghost{font-weight:700;color:var(--cyan-dark);text-decoration:none;font-size:14px;border:2px solid #bfe0ee;padding:10px 18px;border-radius:999px}
  .stats{margin-top:46px;display:flex;gap:30px}
  .stats .s .n{font-size:26px;font-weight:800;color:var(--cyan)}
  .stats .s .l{font-size:12px;color:var(--ink2);font-weight:600}

  .hero-visual{position:relative;z-index:1;display:flex;justify-content:center;align-items:center}
  .hero-visual svg{width:100%;max-width:560px;height:auto;overflow:visible;filter:drop-shadow(0 26px 40px rgba(16,90,120,.22))}

  @media(max-width:880px){.hero{grid-template-columns:1fr}.hero-visual{order:-1}.stats{gap:20px}}
</style>
</head>
<body>
<nav class="nav">
  <div class="brand"><span class="badge">A</span>aurena<span class="dot">.at</span></div>
  <div class="links"><a href="#">Auktionen</a><a href="#">Lose</a><a class="btn" href="#">Jetzt bieten →</a></div>
</nav>

<header class="hero wrap">
  <div class="hero-copy">
    <span class="eyebrow" id="eyebrow">● Live-Auktionen</span>
    <h1>Auktionen<br><span class="cyan">ohne</span> <span class="lime">Limit.</span></h1>
    <p class="sub">Vom ersten Gebot bis zum Zuschlag — Aurena bringt Industrie­auktionen in Bewegung. Schnell, fair, ohne Limit.</p>
    <div class="actions">
      <a class="btn" href="#">Jetzt bieten →</a>
      <a class="ghost" href="#">Aktuelle Lose ansehen</a>
    </div>
    <div class="stats">
      <div class="s"><div class="n" id="s1">0</div><div class="l">Lose / Monat</div></div>
      <div class="s"><div class="n" id="s2">0</div><div class="l">Zuschläge / Tag</div></div>
      <div class="s"><div class="n">0€</div><div class="l">Mindestpreis</div></div>
    </div>
  </div>

  <div class="hero-visual">
    <!-- Flat comic gavel in Aurena blue, oriented like the logo -->
    <svg viewBox="0 0 360 360" aria-hidden="true">
      <defs>
        <clipPath id="headClip"><rect x="-86" y="-38" width="172" height="76" rx="38"/></clipPath>
        <clipPath id="handClip"><rect x="-17" y="22" width="34" height="150" rx="17"/></clipPath>
      </defs>

      <!-- soft ground ellipse -->
      <ellipse cx="186" cy="312" rx="120" ry="20" fill="#cfe6f1"/>

      <!-- sound block the hammer taps -->
      <g id="block">
        <rect x="92" y="262" width="150" height="34" rx="16" fill="var(--cyan-dark)"/>
        <rect x="92" y="262" width="150" height="13" rx="6" fill="var(--lime)"/>
        <rect x="108" y="296" width="118" height="16" rx="7" fill="#0c536f"/>
      </g>

      <!-- lime impact spark (pulses on tap) -->
      <g id="spark" opacity="0">
        <path d="M250,232 l16,-22 M268,244 l24,-8 M256,258 l20,10" stroke="var(--lime)" stroke-width="6" stroke-linecap="round"/>
      </g>

      <!-- GAVEL (outer = animated, inner = static orientation) -->
      <g id="gavelAnim">
        <g transform="translate(178 150) rotate(-27)">
          <!-- handle -->
          <g clip-path="url(#handClip)">
            <rect x="-17" y="22" width="34" height="150" fill="var(--cyan)"/>
            <rect x="1" y="22" width="16" height="150" fill="var(--cyan-deep)"/>
          </g>
          <circle cx="0" cy="168" r="23" fill="var(--cyan-deep)"/>
          <circle cx="-7" cy="161" r="6" fill="#fff" opacity=".5"/>
          <!-- head -->
          <g clip-path="url(#headClip)">
            <rect x="-86" y="-38" width="172" height="76" fill="var(--cyan)"/>
            <rect x="-86" y="10" width="172" height="28" fill="var(--cyan-deep)"/>
            <rect x="-54" y="-30" width="118" height="15" rx="7" fill="#fff" opacity=".5"/>
          </g>
          <!-- end caps -->
          <rect x="-86" y="-38" width="28" height="76" rx="14" fill="var(--cyan-dark)"/>
          <rect x="58" y="-38" width="28" height="76" rx="14" fill="var(--cyan-dark)"/>
          <!-- lime collar where handle meets head -->
          <rect x="-18" y="4" width="36" height="34" rx="11" fill="var(--lime)"/>
          <rect x="-18" y="4" width="36" height="12" rx="6" fill="#b6da55"/>
        </g>
      </g>
    </svg>
  </div>
</header>

<script src="./vendor/gsap/gsap.min.js"></script>
<script src="./vendor/gsap/SplitText.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  if (!window.gsap) return;
  gsap.registerPlugin(SplitText);
  const mm = gsap.matchMedia();

  mm.add('(prefers-reduced-motion: no-preference)', () => {
    // intro
    const h = new SplitText('.hero h1', { type:'words' });
    gsap.timeline()
      .from('.eyebrow', { opacity:0, y:-10, duration:.5 }, 0)
      .from(h.words, { opacity:0, y:30, stagger:.08, duration:.7, ease:'power3.out' }, .1)
      .from('.hero .sub', { opacity:0, y:16, duration:.6 }, .5)
      .from('.actions', { opacity:0, y:16, duration:.6 }, .65)
      .from('.stats .s', { opacity:0, y:16, stagger:.1, duration:.5 }, .8)
      .from('.hero-visual', { opacity:0, scale:.92, duration:.8, ease:'power3.out' }, .25);

    // count-up stats
    const cu = (id,to,suf='')=>{const o={v:0},el=document.getElementById(id);
      gsap.to(o,{v:to,duration:1.6,delay:.9,ease:'power2.out',onUpdate:()=>el.textContent=Math.round(o.v).toLocaleString('de-DE')+suf});};
    cu('s1',12000,'+'); cu('s2',340);

    // gentle hammer TAP loop (rotates around the hand)
    const tap = gsap.timeline({ repeat:-1, repeatDelay:.7, delay:1.2 });
    tap.to('#gavelAnim', { rotation:13, transformOrigin:'201px 289px', duration:.5, ease:'power2.in' })
       .set('#spark', { opacity:1 })
       .to('#block', { y:4, duration:.06, yoyo:true, repeat:1 }, '<')
       .to('#spark', { opacity:0, duration:.35 }, '>')
       .to('#gavelAnim', { rotation:0, transformOrigin:'201px 289px', duration:.7, ease:'elastic.out(1,0.5)' });
  });

  mm.add('(prefers-reduced-motion: reduce)', () => {
    document.getElementById('s1').textContent='12.000+';
    document.getElementById('s2').textContent='340';
  });
});
</script>
</body>
</html>
